                  changed = True
              add_sub_snippet = f'\n            try {{ if (headerItem != null) headerItem.addSubItem({notes_menu_id}, "Notes • Панель функций"); }} catch (Throwable ignored) {{}}'
              if f"headerItem.addSubItem({notes_menu_id}" not in ca and "headerItem.addSubItem(" in ca:
