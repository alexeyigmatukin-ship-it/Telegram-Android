name: Build Custom Telegram APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle and CMake
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            TMessagesProj/.cxx
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > TMessagesProj/my_telegram.jks

      - name: Apply Custom Patches (Package, Anti-Delete, Save TTL Media)
        run: |
          python3 - << 'EOF'
          import re, glob

          # 1. API Keys
          bv_path = "TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java"
          with open(bv_path, "r", encoding="utf-8") as f:
              bv = f.read()
          bv = re.sub(r'public static int APP_ID = .*?;', 'public static int APP_ID = 2040;', bv)
          bv = re.sub(r'public static String APP_HASH = .*?;', 'public static String APP_HASH = "b18441a1ff607e10a989891a5462e627";', bv)
          with open(bv_path, "w", encoding="utf-8") as f:
              f.write(bv)

          # 2. Separate Package ID & App Name
          app_gradle = "TMessagesProj_App/build.gradle"
          with open(app_gradle, "r", encoding="utf-8") as f:
              ag = f.read()
          ag = ag.replace('applicationId "org.telegram.messenger"', 'applicationId "org.telegram.mycustom"')
          with open(app_gradle, "w", encoding="utf-8") as f:
              f.write(ag)

          for xml_file in glob.glob("TMessagesProj/src/main/res/values*/strings.xml"):
              with open(xml_file, "r", encoding="utf-8") as f:
                  xml = f.read()
              xml = xml.replace('<string name="AppName">Telegram</string>', '<string name="AppName">MyTelegram</string>')
              with open(xml_file, "w", encoding="utf-8") as f:
                  f.write(xml)

          # 3. Anti-Delete (block local DB deletion)
          ms_path = "TMessagesProj/src/main/java/org/telegram/messenger/MessagesStorage.java"
          with open(ms_path, "r", encoding="utf-8") as f:
              ms = f.read()
          target_del = "public void markMessagesAsDeleted(final long dialogId, final ArrayList<Integer> messages, boolean channel, boolean scheduled, int deleteDate, int taskId) {"
          if target_del in ms:
              ms = ms.replace(target_del, target_del + "\n        if (true) return;")
              print("Anti-delete patch applied!")
          with open(ms_path, "w", encoding="utf-8") as f:
              f.write(ms)

          # 4. Save Disposable Media (allow saving secret/TTL media)
          smv_path = "TMessagesProj/src/main/java/org/telegram/ui/SecretMediaViewer.java"
          with open(smv_path, "r", encoding="utf-8") as f:
              smv = f.read()
          smv = smv.replace("isSecretMedia()", "false")
          with open(smv_path, "w", encoding="utf-8") as f:
              f.write(smv)
          print("TTL media patch applied!")
          EOF

          cat << 'EOF' >> TMessagesProj/build.gradle
          android {
              signingConfigs {
                  release {
                      storeFile file("my_telegram.jks")
                      storePassword "${{ secrets.KEYSTORE_PASSWORD }}"
                      keyAlias "${{ secrets.KEY_ALIAS }}"
                      keyPassword "${{ secrets.KEY_PASSWORD }}"
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Build arm64 Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleAfatRelease --max-workers=4

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyTelegram-arm64
          path: TMessagesProj_App/build/outputs/apk/afat/release/*.apk
