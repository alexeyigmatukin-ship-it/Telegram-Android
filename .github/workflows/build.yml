          # 10. Patch ChatActivity, DialogsActivity & SettingsActivity so Notes Hub & Guide are always reachable
          notes_menu_id = 99101
          for ca_path in glob.glob("TMessagesProj/src/main/java/**/ChatActivity.java", recursive=True):
