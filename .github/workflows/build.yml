          ]
          with open(f"{h_dir}/LocalWhisperHelper.java", "w", encoding="utf-8") as f:
              f.write("\n".join(whisper_lines) + "\n")
          diag("WHISPER", f"Wrote {h_dir}/LocalWhisperHelper.java ({len(whisper_lines)} lines)")

          # 9. Patch MessagesController, MessagesStorage, ConnectionsManager, SecretMediaViewer, TranscribeButton & UserConfig
          def build_delete_guard(sig, marker):
              params = parse_java_params(sig)
              did_expr = "0L"
              ids_expr = None
              for p_type, p_name in params:
                  if p_type == "long" and did_expr == "0L":
                      did_expr = p_name
                  elif "ArrayList<Integer>" in p_type or "List<Integer>" in p_type:
                      ids_expr = p_name
              lines = [f"        // {marker}"]
              lines.append("        if (org.telegram.messenger.CustomConfig.isGuestHandoverActive()) return;")
              if ids_expr:
                  lines.append(f"        try {{ if (org.telegram.messenger.CustomConfig.isSaveDeletedEnabled({did_expr})) {{ org.telegram.messenger.CustomConfig.markDeletedBatch({did_expr}, {ids_expr}); return; }} }} catch (Throwable ignored) {{}}")
              else:
                  lines.append(f"        try {{ if (org.telegram.messenger.CustomConfig.isSaveDeletedEnabled({did_expr})) {{ org.telegram.messenger.CustomConfig.markDeletedLocally({did_expr}, 0); return; }} }} catch (Throwable ignored) {{}}")
              return "\n".join(lines)

          def build_ghost_local_read_guard(sig, marker):
              params = parse_java_params(sig)
              did_expr = "0L"
              for p_type, p_name in params:
                  if p_type == "long" and ("did" in p_name.lower() or "dialog" in p_name.lower() or "peer" in p_name.lower() or did_expr == "0L"):
                      did_expr = p_name
                      break
              return f"""        // {marker}
                  if (org.telegram.messenger.CustomConfig.isGhostRead({did_expr})) {{
                      try {{
                          if ({did_expr} != 0L && dialogs_dict != null) {{
                              org.telegram.tgnet.TLRPC.Dialog dlg = dialogs_dict.get({did_expr});
                              if (dlg != null && dlg.unread_count > 0) {{
                                  dlg.unread_count = 0;
                                  org.telegram.messenger.NotificationCenter.getInstance(currentAccount).postNotificationName(org.telegram.messenger.NotificationCenter.dialogsNeedReload);
                              }}
                          }}
                      }} catch (Throwable ignored) {{}}
                      return;
                  }}"""

          def build_typing_guard(sig, marker):
              params = parse_java_params(sig)
              did_expr = "0L"
              for p_type, p_name in params:
                  if p_type == "long":
                      did_expr = p_name
                      break
              return f"        // {marker}\n        if (org.telegram.messenger.CustomConfig.isNoTyping({did_expr})) return;"

          for mc_path in glob.glob("TMessagesProj/src/main/java/**/MessagesController.java", recursive=True):
              try:
                  with open(mc_path, "r", encoding="utf-8") as f:
                      mc = f.read()
              except Exception:
                  continue
              mc, c_del = inject_at_all_methods_start(
                  mc,
                  r'(?:public|private|protected)\s+void\s+deleteMessages\s*\([^)]*\)',
                  build_delete_guard,
                  "NOTES_DEL_GUARD"
              )
              mc, c_rd1 = inject_at_all_methods_start(
                  mc,
                  r'(?:public|private|protected)\s+void\s+markDialogAsRead\s*\([^)]*\)',
                  build_ghost_local_read_guard,
                  "NOTES_READ_GUARD"
              )
              mc, c_rd2 = inject_at_all_methods_start(
                  mc,
                  r'(?:public|private|protected)\s+void\s+markMessageContentAsRead\s*\([^)]*\)',
                  build_ghost_local_read_guard,
                  "NOTES_READ_CONTENT_GUARD"
              )
              mc, c_typ = inject_at_all_methods_start(
                  mc,
                  r'(?:public|private|protected)\s+void\s+sendTyping\s*\([^)]*\)',
                  build_typing_guard,
                  "NOTES_TYPING_GUARD"
              )
              if (c_del + c_rd1 + c_rd2 + c_typ) > 0:
                  with open(mc_path, "w", encoding="utf-8") as f:
                      f.write(mc)
              diag("MSG_CTRL", f"Patched {mc_path} del={c_del} readDialog={c_rd1} readContent={c_rd2} typing={c_typ}")

          # Network-level Ghost Read block in ConnectionsManager so read receipts never leak while local unread_count resets
          for cm_path in glob.glob("TMessagesProj/src/main/java/**/ConnectionsManager.java", recursive=True):
              try:
                  with open(cm_path, "r", encoding="utf-8") as f:
                      cm = f.read()
              except Exception:
                  continue
              cm_snippet = """        // NOTES_NET_GHOST_GUARD
                  try {
                      if (object != null && org.telegram.messenger.CustomConfig.isGhostRead(0L)) {
                          String clsName = object.getClass().getSimpleName();
                          if (clsName.contains("readHistory") || clsName.contains("readMessageContents") || clsName.contains("readEncryptedHistory")) {
                              return 0;
                          }
                      }
                  } catch (Throwable ignored) {}"""
              cm, c_cm, st_cm = inject_at_method_start(
                  cm,
                  r'public\s+int\s+sendRequest\s*\(\s*TLObject\s+object\s*,',
                  cm_snippet,
                  "NOTES_NET_GHOST_GUARD"
              )
              if c_cm > 0:
                  with open(cm_path, "w", encoding="utf-8") as f:
                      f.write(cm)
              diag("CONN_MGR", f"Patched {cm_path} sendRequest={c_cm}({st_cm})")

          def build_storage_del_guard(sig, marker):
              params = parse_java_params(sig)
              did_expr = "0L"
              ids_expr = None
              for p_type, p_name in params:
                  if p_type == "long" and did_expr == "0L":
                      did_expr = p_name
                  elif "ArrayList<Integer>" in p_type or "List<Integer>" in p_type:
                      ids_expr = p_name
              ret_stmt = "return;" if " void " in sig else ("return new java.util.ArrayList<>();" if "ArrayList" in sig else ("return 0;" if " int " in sig else "return false;"))
              lines = [f"        // {marker}"]
              if ids_expr:
                  lines.append(f"        try {{ if (org.telegram.messenger.CustomConfig.isSaveDeletedEnabled({did_expr})) {{ org.telegram.messenger.CustomConfig.markDeletedBatch({did_expr}, {ids_expr}); {ret_stmt} }} }} catch (Throwable ignored) {{}}")
              else:
                  lines.append(f"        try {{ if (org.telegram.messenger.CustomConfig.isSaveDeletedEnabled({did_expr})) {{ org.telegram.messenger.CustomConfig.markDeletedLocally({did_expr}, 0); {ret_stmt} }} }} catch (Throwable ignored) {{}}")
              return "\n".join(lines)

          for ms_path in glob.glob("TMessagesProj/src/main/java/**/MessagesStorage.java", recursive=True):
              try:
                  with open(ms_path, "r", encoding="utf-8") as f:
                      ms = f.read()
              except Exception:
                  continue
              ms, c_ms = inject_at_all_methods_start(
                  ms,
                  r'(?:public|private|protected)\s+(?:void|ArrayList<[^>]+>|int|boolean)\s+markMessagesAsDeleted\s*\([^)]*\)',
                  build_storage_del_guard,
                  "NOTES_STORAGE_DEL_GUARD"
              )
              if c_ms > 0:
                  with open(ms_path, "w", encoding="utf-8") as f:
                      f.write(ms)
              diag("MSG_STORAGE", f"Patched {ms_path} markMessagesAsDeleted={c_ms}")

          for sm_path in glob.glob("TMessagesProj/src/main/java/**/SecretMediaViewer.java", recursive=True):
              try:
                  with open(sm_path, "r", encoding="utf-8") as f:
                      sm = f.read()
              except Exception:
                  continue
              sm, c_sm1, st_sm1 = inject_at_method_start(
                  sm,
                  r'(?:public|private|protected)\s+void\s+openMedia\s*\([^)]*\)',
                  '        try { if (messageObject != null) { org.telegram.messenger.LocalWhisperHelper.saveSecretMessageObjectToVault(currentAccount, messageObject); } else if (currentMessageObject != null) { org.telegram.messenger.LocalWhisperHelper.saveSecretMessageObjectToVault(currentAccount, currentMessageObject); } } catch (Throwable ignored) {}',
                  "org.telegram.messenger.LocalWhisperHelper.saveSecretMessageObjectToVault"
              )
              sm, c_sm2, st_sm2 = inject_at_method_start(
                  sm,
                  r'(?:public|private|protected)\s+void\s+closePhoto\s*\([^)]*\)',
                  '        try { if (currentMessageObject != null) { org.telegram.messenger.LocalWhisperHelper.saveSecretMessageObjectToVault(currentAccount, currentMessageObject); } } catch (Throwable ignored) {}',
                  "NOTES_CLOSE_PHOTO_VAULT"
              )
              if (c_sm1 + c_sm2) > 0:
                  with open(sm_path, "w", encoding="utf-8") as f:
                      f.write(sm)
              diag("SECRET_MEDIA", f"Patched {sm_path} openMedia={c_sm1}({st_sm1}) closePhoto={c_sm2}({st_sm2})")

          # 9B. Local Transcription Override
          transcribe_hooks = 0
          for tb_path in glob.glob("TMessagesProj/src/main/java/**/TranscribeButton.java", recursive=True):
              try:
                  with open(tb_path, "r", encoding="utf-8") as f:
                      tb = f.read()
              except Exception:
                  continue
              tb_new, c_tb1 = inject_at_all_methods_start(
                  tb,
                  r'(?:public|private|protected)\s+void\s+onTap\s*\([^)]*\)',
                  lambda sig, mk: f"        // {mk}\n        try {{ if (parent != null && parent.getMessageObject() != null && org.telegram.messenger.LocalWhisperHelper.handleTranscribeMessageObject(org.telegram.messenger.UserConfig.selectedAccount, parent.getMessageObject())) return; }} catch (Throwable ignored) {{}}",
                  "NOTES_TRANSCRIBE_TAP"
              )
              if c_tb1 > 0:
                  with open(tb_path, "w", encoding="utf-8") as f:
                      f.write(tb_new)
                  transcribe_hooks += c_tb1
              diag("TRANSCRIBE_BTN", f"Patched {tb_path} onTap={c_tb1}")

          for uc_path in glob.glob("TMessagesProj/src/main/java/**/UserConfig.java", recursive=True):
              try:
                  with open(uc_path, "r", encoding="utf-8") as f:
                      uc = f.read()
              except Exception:
                  continue
              uc_new, c_uc, st_uc = inject_at_method_start(
                  uc,
                  r'public\s+boolean\s+isPremium\s*\(\s*\)',
                  '        if (org.telegram.messenger.CustomConfig.isLocalPremiumEnabled()) return true;',
                  "org.telegram.messenger.CustomConfig.isLocalPremiumEnabled()"
              )
              if c_uc > 0:
                  with open(uc_path, "w", encoding="utf-8") as f:
                      f.write(uc_new)
              diag("USER_CFG", f"Patched {uc_path} isPremium={c_uc}({st_uc})")

          # 10. Direct OnClickListener UI Hooks in SettingsActivity, ChatActivity & DialogsActivity
          notes_menu_id = 99111
          ui_hooks_ok = 0

          # 10A. SettingsActivity
          for st_path in glob.glob("TMessagesProj/src/main/java/**/SettingsActivity.java", recursive=True):
              try:
                  with open(st_path, "r", encoding="utf-8") as f:
                      st = f.read()
              except Exception:
                  continue
              st, c_st_cr, st_st_cr = inject_at_method_start(
                  st,
                  r'public\s+boolean\s+onFragmentCreate\s*\(\s*\)',
                  '        try { org.telegram.messenger.LocalWhisperHelper.refreshDisplayAndGuestGuard(getParentActivity()); } catch (Throwable ignored) {}',
                  "org.telegram.messenger.LocalWhisperHelper.refreshDisplayAndGuestGuard(getParentActivity())"
              )
              st_menu_snippet = f"""
                      try {{
                          if (actionBar != null) {{
                              org.telegram.ui.ActionBar.ActionBarMenu notesTopMenu = actionBar.createMenu();
                              if (notesTopMenu != null) {{
                                  org.telegram.ui.ActionBar.ActionBarMenuItem notesBtn = notesTopMenu.addItem({notes_menu_id}, org.telegram.messenger.R.drawable.msg_settings);
                                  notesBtn.setContentDescription("Notes");
                                  notesBtn.setOnClickListener(new android.view.View.OnClickListener() {{
                                      @Override
                                      public void onClick(android.view.View v) {{
                                          org.telegram.messenger.LocalWhisperHelper.openNotesMainHub(getParentActivity(), 0L);
                                      }}
                                  }});
                              }}
                          }}
                      }} catch (Throwable ignored) {{}}
              """
              c_st_menu = 0
              st_st_menu = "stmt_not_found"
              for anchor_pat in [
                  r'actionBar\.setActionBarMenuOnItemClick\s*\([^;]*\)\s*;',
                  r'otherItem\s*=\s*menu\.addItem\s*\([^;]*\)\s*;',
                  r'actionBar\.setBackButtonImage\s*\([^;]*\)\s*;',
                  r'super\.createView\s*\([^)]*\)\s*;'
              ]:
                  st, c_st_menu, st_st_menu = inject_after_statement_in_method(
                      st,
                      r'public\s+View\s+createView\s*\([^)]*\)',
                      anchor_pat,
                      st_menu_snippet,
                      f"notesTopMenu.addItem({notes_menu_id}"
                  )
                  if c_st_menu > 0:
                      break
              if (c_st_cr + c_st_menu) > 0:
                  with open(st_path, "w", encoding="utf-8") as f:
                      f.write(st)
              if c_st_menu > 0:
                  ui_hooks_ok += 1
              diag("UI_SETTINGS", f"Patched {st_path}: onCreate={c_st_cr}({st_st_cr}), directMenu={c_st_menu}({st_st_menu})")

          # 10B. ChatActivity
          for ca_path in glob.glob("TMessagesProj/src/main/java/**/ChatActivity.java", recursive=True):
              try:
                  with open(ca_path, "r", encoding="utf-8") as f:
                      ca = f.read()
              except Exception:
                  continue
              ca, c_ca_cr, st_ca_cr = inject_at_method_start(
                  ca,
                  r'public\s+boolean\s+onFragmentCreate\s*\(\s*\)',
                  '        try { org.telegram.messenger.LocalWhisperHelper.refreshDisplayAndGuestGuard(getParentActivity()); } catch (Throwable ignored) {}',
                  "org.telegram.messenger.LocalWhisperHelper.refreshDisplayAndGuestGuard(getParentActivity())"
              )
              ca_sub_snippet = f"""
                      try {{
                          if (headerItem != null) {{
                              android.view.View notesChatSub = headerItem.addSubItem({notes_menu_id}, "Notes • Центр управления");
                              if (notesChatSub != null) {{
                                  notesChatSub.setOnClickListener(new android.view.View.OnClickListener() {{
                                      @Override
                                      public void onClick(android.view.View v) {{
                                          headerItem.closeSubMenu();
                                          org.telegram.messenger.LocalWhisperHelper.openNotesMainHub(getParentActivity(), dialog_id);
                                      }}
                                  }});
                              }}
                          }}
                      }} catch (Throwable ignored) {{}}
              """
              ca, c_ca_menu, st_ca_menu = inject_after_statement_in_method(
                  ca,
                  r'public\s+View\s+createView\s*\([^)]*\)',
                  r'headerItem\s*=\s*menu\.addItem\s*\([^;]*\)\s*;',
                  ca_sub_snippet,
                  f"headerItem.addSubItem({notes_menu_id}"
              )
              if (c_ca_cr + c_ca_menu) > 0:
                  with open(ca_path, "w", encoding="utf-8") as f:
                      f.write(ca)
              if c_ca_menu > 0:
                  ui_hooks_ok += 1
              diag("UI_CHAT", f"Patched {ca_path}: onCreate={c_ca_cr}({st_ca_cr}), directSubItem={c_ca_menu}({st_ca_menu})")

          # 10C. DialogsActivity
          for da_path in glob.glob("TMessagesProj/src/main/java/**/DialogsActivity.java", recursive=True):
              try:
                  with open(da_path, "r", encoding="utf-8") as f:
                      da = f.read()
              except Exception:
                  continue
              da, c_da_cr, st_da_cr = inject_at_method_start(
                  da,
                  r'public\s+boolean\s+onFragmentCreate\s*\(\s*\)',
                  '        try { org.telegram.messenger.LocalWhisperHelper.refreshDisplayAndGuestGuard(getParentActivity()); } catch (Throwable ignored) {}',
                  "org.telegram.messenger.LocalWhisperHelper.refreshDisplayAndGuestGuard(getParentActivity())"
              )
              da_menu_snippet = f"""
                      try {{
                          org.telegram.ui.ActionBar.ActionBarMenu notesDialogsMenu = actionBar.createMenu();
                          if (notesDialogsMenu != null) {{
                              org.telegram.ui.ActionBar.ActionBarMenuItem notesDItem = notesDialogsMenu.addItem({notes_menu_id}, org.telegram.messenger.R.drawable.msg_settings);
                              notesDItem.setContentDescription("Notes");
                              notesDItem.setOnClickListener(new android.view.View.OnClickListener() {{
                                  @Override
                                  public void onClick(android.view.View v) {{
                                      org.telegram.messenger.LocalWhisperHelper.openNotesMainHub(getParentActivity(), 0L);
                                  }}
                              }});
                          }}
                      }} catch (Throwable ignored) {{}}
              """
              da, c_da_menu, st_da_menu = inject_after_statement_in_method(
                  da,
                  r'public\s+View\s+createView\s*\([^)]*\)',
                  r'actionBar\.setActionBarMenuOnItemClick\s*\([^;]*\)\s*;',
                  da_menu_snippet,
                  f"notesDialogsMenu.addItem({notes_menu_id}"
              )
              if (c_da_cr + c_da_menu) > 0:
                  with open(da_path, "w", encoding="utf-8") as f:
                      f.write(da)
              if c_da_menu > 0:
                  ui_hooks_ok += 1
              diag("UI_DIALOGS", f"Patched {da_path}: onCreate={c_da_cr}({st_da_cr}), directMenu={c_da_menu}({st_da_menu})")

          diag("UI_GATE", f"Active direct-click UI entry points injected: {ui_hooks_ok}/3 | transcribeHooks={transcribe_hooks}")
          if ui_hooks_ok == 0:
              diag("FATAL", "No UI entry points were injected! Stopping early before Gradle.")
              sys.exit(1)
          EOF

      - name: Build arm64 Release APK
        env:
          GRADLE_OPTS: "-Xmx4g -Dorg.gradle.jvmargs=-Xmx4g -Dkotlin.daemon.jvm.options=-Xmx2g -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"
        run: |
          set -o pipefail
          ./gradlew :TMessagesProj_App:assembleAfatRelease --max-workers=4 --no-daemon --stacktrace 2>&1 | tee gradle_build.log || {
            echo "=== GRADLE FAILURE SUMMARY ==="
            grep -n -C 15 -E "FAILURE:|What went wrong:|error:|Exception" gradle_build.log | tail -n 80 || true
            exit 1
          }

      - name: Verify APK Package Name, Launchable Activity & Signature
        run: |
          APK_PATH=$(find TMessagesProj_App/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found APK: $APK_PATH"
          test -n "$APK_PATH"
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -n 1)
          AAPT="$BUILD_TOOLS_DIR/aapt2"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          "$AAPT" dump badging "$APK_PATH" | head -n 30
          "$AAPT" dump badging "$APK_PATH" | grep -q "package: name='com.alexey.notesclient'"
          "$APKSIGNER" verify --verbose --print-certs "$APK_PATH"

      - name: Upload APK & v11 Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NotesClient-arm64-v11
          path: |
            TMessagesProj_App/build/outputs/apk/**/*.apk
            v11_diagnostics/patch_report.log
