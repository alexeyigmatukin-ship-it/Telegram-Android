              "  public static File saveSecretMediaToVault(String sourcePath, boolean isVideo) {",
              "    try {",
              "      if (!CustomConfig.isSaveSecretMediaEnabled(0L) || TextUtils.isEmpty(sourcePath)) return null;",
              "      File src = new File(sourcePath);",
              "      if (!src.exists() || !src.canRead() || src.length() == 0) return null;",
              "      File baseDir = Environment.getExternalStoragePublicDirectory(isVideo ? Environment.DIRECTORY_MOVIES : Environment.DIRECTORY_PICTURES);",
              "      File vaultDir = new File(baseDir, \"NotesVault\");",
              "      if (!vaultDir.exists() && !vaultDir.mkdirs()) {",
              "        vaultDir = new File(ApplicationLoader.applicationContext.getExternalFilesDir(isVideo ? Environment.DIRECTORY_MOVIES : Environment.DIRECTORY_PICTURES), \"NotesVault\");",
              "        if (!vaultDir.exists() && !vaultDir.mkdirs()) return null;",
              "      }",
              "      File dst = new File(vaultDir, (isVideo ? \"vault_vid_\" : \"vault_img_\") + System.currentTimeMillis() + (isVideo ? \".mp4\" : \".jpg\"));",
              "      try (FileInputStream in = new FileInputStream(src); FileOutputStream out = new FileOutputStream(dst)) {",
              "        byte[] buf = new byte[16384]; int len;",
              "        while ((len = in.read(buf)) > 0) out.write(buf, 0, len);",
              "      }",
              "      return dst;",
              "    } catch (Throwable ignored) { return null; }",
              "  }",
              "  public static File decodeMediaToMono16kWav(String inputPath) {",
              "    MediaExtractor extractor = null;",
              "    MediaCodec codec = null;",
              "    try {",
              "      if (TextUtils.isEmpty(inputPath)) return null;",
              "      File inFile = new File(inputPath);",
              "      if (!inFile.exists() || inFile.length() == 0) return null;",
              "      File outWav = new File(ApplicationLoader.applicationContext.getCacheDir(), \"whisper_ru_16k_\" + System.currentTimeMillis() + \".wav\");",
              "      extractor = new MediaExtractor();",
              "      extractor.setDataSource(inputPath);",
              "      int audioTrack = -1;",
              "      for (int i = 0; i < extractor.getTrackCount(); i++) {",
              "        MediaFormat fmt = extractor.getTrackFormat(i);",
              "        String mime = fmt.getString(MediaFormat.KEY_MIME);",
              "        if (mime != null && mime.startsWith(\"audio/\")) { audioTrack = i; break; }",
              "      }",
              "      if (audioTrack < 0) { extractor.release(); return inFile; }",
              "      extractor.selectTrack(audioTrack);",
              "      MediaFormat format = extractor.getTrackFormat(audioTrack);",
              "      String mime = format.getString(MediaFormat.KEY_MIME);",
              "      codec = MediaCodec.createDecoderByType(mime);",
              "      codec.configure(format, null, null, 0);",
              "      codec.start();",
              "      ByteArrayOutputStream pcmOut = new ByteArrayOutputStream();",
              "      MediaCodec.BufferInfo info = new MediaCodec.BufferInfo();",
              "      boolean sawInputEOS = false; boolean sawOutputEOS = false;",
              "      long deadlineMs = System.currentTimeMillis() + 8000L;",
              "      while (!sawOutputEOS && System.currentTimeMillis() < deadlineMs) {",
              "        if (!sawInputEOS) {",
              "          int inIdx = codec.dequeueInputBuffer(5000);",
              "          if (inIdx >= 0) {",
              "            ByteBuffer inBuf = codec.getInputBuffer(inIdx);",
              "            int sampleSize = extractor.readSampleData(inBuf, 0);",
              "            if (sampleSize < 0) {",
              "              codec.queueInputBuffer(inIdx, 0, 0, 0L, MediaCodec.BUFFER_FLAG_END_OF_STREAM);",
              "              sawInputEOS = true;",
              "            } else {",
              "              codec.queueInputBuffer(inIdx, 0, sampleSize, extractor.getSampleTime(), 0);",
              "              extractor.advance();",
              "            }",
              "          }",
              "        }",
              "        int outIdx = codec.dequeueOutputBuffer(info, 5000);",
              "        if (outIdx >= 0) {",
              "          ByteBuffer outBuf = codec.getOutputBuffer(outIdx);",
              "          if (outBuf != null && info.size > 0) {",
              "            byte[] chunk = new byte[info.size];",
              "            outBuf.get(chunk);",
              "            pcmOut.write(chunk);",
              "          }",
              "          codec.releaseOutputBuffer(outIdx, false);",
              "          if ((info.flags & MediaCodec.BUFFER_FLAG_END_OF_STREAM) != 0) sawOutputEOS = true;",
              "        }",
              "      }",
              "      byte[] pcmData = pcmOut.toByteArray();",
              "      if (pcmData.length == 0) return inFile;",
              "      int sampleRate = format.containsKey(MediaFormat.KEY_SAMPLE_RATE) ? format.getInteger(MediaFormat.KEY_SAMPLE_RATE) : 16000;",
              "      int channels = format.containsKey(MediaFormat.KEY_CHANNEL_COUNT) ? format.getInteger(MediaFormat.KEY_CHANNEL_COUNT) : 1;",
              "      try (FileOutputStream fos = new FileOutputStream(outWav)) {",
              "        writeWavHeader(fos, pcmData.length, sampleRate, channels, 16);",
              "        fos.write(pcmData);",
              "      }",
              "      return outWav;",
              "    } catch (Throwable ignored) {",
              "      return new File(inputPath);",
              "    } finally {",
              "      try { if (codec != null) { codec.stop(); codec.release(); } } catch (Throwable ignored) {}",
              "      try { if (extractor != null) { extractor.release(); } } catch (Throwable ignored) {}",
              "    }",
              "  }",
              "  private static void writeWavHeader(FileOutputStream out, int pcmBytes, int sampleRate, int channels, int bitsPerSample) throws Exception {",
              "    int byteRate = sampleRate * channels * bitsPerSample / 8;",
              "    int blockAlign = channels * bitsPerSample / 8;",
              "    ByteBuffer header = ByteBuffer.allocate(44).order(ByteOrder.LITTLE_ENDIAN);",
              "    header.put(new byte[] {'R', 'I', 'F', 'F'}); header.putInt(36 + pcmBytes); header.put(new byte[] {'W', 'A', 'V', 'E'});",
              "    header.put(new byte[] {'f', 'm', 't', ' '}); header.putInt(16); header.putShort((short) 1); header.putShort((short) channels);",
              "    header.putInt(sampleRate); header.putInt(byteRate); header.putShort((short) blockAlign); header.putShort((short) bitsPerSample);",
              "    header.put(new byte[] {'d', 'a', 't', 'a'}); header.putInt(pcmBytes); out.write(header.array());",
              "  }",
              "  public static boolean handleTranscribeMessageObject(final int account, final MessageObject msgObj) {",
              "    try {",
              "      if (msgObj == null || !CustomConfig.isLocalWhisperRu()) return false;",
              "      final long did = msgObj.getDialogId();",
              "      if (CustomConfig.isStockMode(did)) return false;",
              "      final Activity act = LaunchActivity.instance;",
              "      if (act == null || act.isFinishing()) return false;",
              "      final String path = resolveMessageMediaPath(account, msgObj);",
              "      if (TextUtils.isEmpty(path)) {",
              "        Toast.makeText(act, \"Сначала загрузите голосовое или кружок\", Toast.LENGTH_SHORT).show();",
              "        return true;",
              "      }",
              "      if (!isDecodingAudio.compareAndSet(false, true)) {",
              "        Toast.makeText(act, \"Подготовка аудио уже выполняется...\", Toast.LENGTH_SHORT).show();",
              "        return true;",
              "      }",
              "      Toast.makeText(act, \"Подготовка аудио для расшифровки (RU)...\", Toast.LENGTH_SHORT).show();",
              "      final boolean isRound = msgObj.isRoundVideo();",
              "      new Thread(new Runnable() {",
              "        @Override public void run() {",
              "          try {",
              "            final File prepared = decodeMediaToMono16kWav(path);",
              "            final File target = (prepared != null && prepared.exists()) ? prepared : new File(path);",
              "            new Handler(Looper.getMainLooper()).post(new Runnable() {",
              "              @Override public void run() {",
              "                try {",
              "                  if (target == null || !target.exists()) {",
              "                    Toast.makeText(act, \"Файл аудио не найден\", Toast.LENGTH_SHORT).show();",
              "                    return;",
              "                  }",
              "                  Context ctx = act.getApplicationContext();",
              "                  Uri uri = FileProvider.getUriForFile(ctx, ctx.getPackageName() + \".provider\", target);",
              "                  Intent send = new Intent(Intent.ACTION_SEND);",
              "                  send.setType(\"audio/wav\");",
              "                  send.putExtra(Intent.EXTRA_STREAM, uri);",
              "                  send.putExtra(\"language\", \"ru\");",
              "                  send.putExtra(\"whisper_model\", MODEL_ASSET_PATH);",
              "                  send.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);",
              "                  Intent chooser = Intent.createChooser(send, \"Расшифровать (RU)\");",
              "                  act.startActivity(chooser);",
              "                } catch (Throwable err) {",
              "                  Toast.makeText(act, \"Нет приложения для приёма WAV: \" + target.getName(), Toast.LENGTH_LONG).show();",
              "                }",
              "              }",
              "            });",
              "          } finally {",
              "            isDecodingAudio.set(false);",
              "          }",
              "        }",
              "      }).start();",
              "      return true;",
              "    } catch (Throwable ignored) {",
              "      isDecodingAudio.set(false);",
              "      return false;",
              "    }",
              "  }",
              "  public static void transcribeAudioOrRound(Activity activity, long dialogId, String mediaPath, boolean isRoundVideo) {",
              "    if (activity == null || CustomConfig.isStockMode(dialogId) || TextUtils.isEmpty(mediaPath)) return;",
              "    new Thread(new Runnable() {",
