name: Build Custom Stealth Client APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle and CMake
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            TMessagesProj/.cxx
            TMessagesProj_App/.cxx
          key: ${{ runner.os }}-gradle-stealth-v11-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-gradle-stealth-v11-

      - name: Clone whisper.cpp
        run: |
          rm -rf TMessagesProj/jni/whisper
          git clone --depth 1 https://github.com/ggerganov/whisper.cpp.git TMessagesProj/jni/whisper

      - name: Decode Keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > TMessagesProj/my_telegram.jks
          else
            echo "Warning: KEYSTORE_BASE64 secret is empty"
          fi

      - name: Apply Stealth and Feature Patches (Standalone Package)
        env:
          RAW_API_ID: ${{ secrets.TG_API_ID }}
          RAW_API_HASH: ${{ secrets.TG_API_HASH }}
          NEW_PKG: "com.alexey.notesclient"
          NEW_NAME: "Notes"
        run: |
          python3 - << 'EOF'
          import os, re, glob, json, copy

          api_id = os.environ.get("RAW_API_ID", "").strip() or "2040"
          api_hash = os.environ.get("RAW_API_HASH", "").strip() or "b18441a1ff607e10a989891a5462e627"
          new_pkg = os.environ["NEW_PKG"]
          new_name = os.environ["NEW_NAME"]

          # 1. API Keys
          bv_path = "TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java"
          if os.path.exists(bv_path):
              with open(bv_path, "r", encoding="utf-8") as f:
                  bv = f.read()
              bv = re.sub(r'(public\s+static\s+int\s+APP_ID\s*=\s*)[^;]+;', rf'\g<1>{api_id};', bv)
              bv = re.sub(r'(public\s+static\s+String\s+APP_HASH\s*=\s*)[^;]+;', rf'\g<1>"{api_hash}";', bv)
              with open(bv_path, "w", encoding="utf-8") as f:
                  f.write(bv)

          # 2. Package ID & Authorities in build.gradle files
          for gf_path in glob.glob("**/build.gradle", recursive=True):
              if "/build/" in gf_path or "\\build\\" in gf_path:
                  continue
              with open(gf_path, "r", encoding="utf-8") as f:
                  gf = f.read()
              gf_new = re.sub(
                  r'applicationId\s*=?\s*["\']org\.telegram\.messenger[^"\']*["\']',
                  f'applicationId "{new_pkg}"',
                  gf
              )
              gf_new = re.sub(
                  r'applicationIdSuffix\s*=?\s*["\'][^"\']*["\']',
                  '',
                  gf_new
              )
              gf_new = gf_new.replace("org.telegram.messenger.provider", f"{new_pkg}.provider")
              gf_new = gf_new.replace("org.telegram.messenger.call_provider", f"{new_pkg}.call_provider")
              gf_new = gf_new.replace("org.telegram.messenger.notification_image_provider", f"{new_pkg}.notification_image_provider")
              gf_new = gf_new.replace("org.telegram.messenger.permission.", f"{new_pkg}.permission.")
              if gf_new != gf:
                  with open(gf_path, "w", encoding="utf-8") as f:
                      f.write(gf_new)

          # 3. google-services.json
          for gs_path in glob.glob("**/google-services.json", recursive=True):
              if "/build/" in gs_path or "\\build\\" in gs_path:
                  continue
              with open(gs_path, "r", encoding="utf-8") as f:
                  gs = json.load(f)
              clients = gs.get("client")
              if isinstance(clients, list):
                  existing_pkgs = {
                      c.get("client_info", {}).get("android_client_info", {}).get("package_name", "")
                      for c in clients
                  }
                  if new_pkg not in existing_pkgs:
                      for c in list(clients):
                          pkg = c.get("client_info", {}).get("android_client_info", {}).get("package_name", "")
                          if pkg == "org.telegram.messenger":
                              cloned = copy.deepcopy(c)
                              cloned["client_info"]["android_client_info"]["package_name"] = new_pkg
                              clients.append(cloned)
                              break
              with open(gs_path, "w", encoding="utf-8") as f:
                  json.dump(gs, f, indent=2)

          # 4. AndroidManifest & XML authorities/permissions/providers
          for mf_path in glob.glob("**/AndroidManifest.xml", recursive=True):
              if "/build/" in mf_path or "\\build\\" in mf_path:
                  continue
              with open(mf_path, "r", encoding="utf-8") as f:
                  mf = f.read()
              for suff in [
                  "provider",
                  "call_provider",
                  "notification_image_provider",
                  "beta_provider",
                  "permission.MAPS_RECEIVE",
                  "permission.C2D_MESSAGE",
                  "DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION",
              ]:
                  mf = mf.replace(f"org.telegram.messenger.{suff}", f"{new_pkg}.{suff}")
              # Уникализируем кастомные authorities, если они начинаются с org.telegram.messenger
              mf = re.sub(
                  r'(android:authorities=["\'])org\.telegram\.messenger\.([^"\']+)(["\'])',
                  rf'\g<1>{new_pkg}.\g<2>\g<3>',
                  mf
              )
              with open(mf_path, "w", encoding="utf-8") as f:
                  f.write(mf)

          for rx_path in glob.glob("**/res/xml/*.xml", recursive=True):
              if "/build/" in rx_path or "\\build\\" in rx_path:
                  continue
              with open(rx_path, "r", encoding="utf-8") as f:
                  rx = f.read()
              if "org.telegram.messenger" in rx:
                  rx = rx.replace("org.telegram.messenger", new_pkg)
                  with open(rx_path, "w", encoding="utf-8") as f:
                      f.write(rx)

          # 5. AppName
          for xml_path in glob.glob("TMessagesProj/src/main/res/values*/strings.xml"):
              with open(xml_path, "r", encoding="utf-8") as f:
                  xml = f.read()
              xml = re.sub(r'<string name="AppName">[^<]*</string>', f'<string name="AppName">{new_name}</string>', xml)
              with open(xml_path, "w", encoding="utf-8") as f:
                  f.write(xml)

          # 6. CustomConfig
          h_dir = "TMessagesProj/src/main/java/org/telegram/messenger"
          custom_cfg_code = """package org.telegram.messenger;

          import android.content.Context;
          import android.content.SharedPreferences;
          import java.util.Collections;
          import java.util.HashSet;
          import java.util.Set;

          public class CustomConfig {
              private static final Set<String> deletedIds = Collections.synchronizedSet(new HashSet<>());

              private static SharedPreferences getPrefs() {
                  return ApplicationLoader.applicationContext.getSharedPreferences("my_custom_prefs", Context.MODE_PRIVATE);
              }

              public static boolean isStockMode(long dialogId) {
                  return getPrefs().getBoolean("stock_" + dialogId, false);
              }

              public static void toggleStockMode(long dialogId) {
                  getPrefs().edit().putBoolean("stock_" + dialogId, !isStockMode(dialogId)).apply();
              }

              public static boolean isForce120Hz() {
                  return getPrefs().getBoolean("force_120hz", true);
              }

              public static void markDeletedLocally(long dialogId, int msgId) {
                  deletedIds.add(dialogId + "_" + msgId);
              }

              public static boolean isDeletedLocally(long dialogId, int msgId) {
                  return deletedIds.contains(dialogId + "_" + msgId);
              }
          }
          """
          with open(f"{h_dir}/CustomConfig.java", "w", encoding="utf-8") as f:
              f.write(custom_cfg_code)

          # 7. Hook Whisper transcription methods
          whisper_hook_snippet = """
                  if (msgObject != null) {
                      final MessageObject targetMsg = msgObject;
                      final int accId = UserConfig.selectedAccount;
                      Utilities.globalQueue.postRunnable(() -> {
                          java.io.File file = FileLoader.getInstance(accId).getPathToMessage(targetMsg.messageOwner);
                          if (file == null || !file.exists()) {
                              AndroidUtilities.runOnUIThread(() -> {
                                  targetMsg.messageOwner.voiceTranscription = "Сначала скачай голосовое...";
                                  targetMsg.messageOwner.voiceTranscriptionOpen = true;
                                  NotificationCenter.getInstance(accId).postNotificationName(NotificationCenter.voiceTranscriptionUpdate, targetMsg, null, targetMsg.messageOwner.voiceTranscription, true, true);
                              });
                              return;
                          }
                          AndroidUtilities.runOnUIThread(() -> {
                              targetMsg.messageOwner.voiceTranscription = "Whisper расшифровывает...";
                              targetMsg.messageOwner.voiceTranscriptionOpen = true;
                              NotificationCenter.getInstance(accId).postNotificationName(NotificationCenter.voiceTranscriptionUpdate, targetMsg, null, targetMsg.messageOwner.voiceTranscription, true, false);
                          });
                          String text = org.telegram.messenger.WhisperHelper.transcribeFile(file);
                          AndroidUtilities.runOnUIThread(() -> {
                              targetMsg.messageOwner.voiceTranscription = text;
                              targetMsg.messageOwner.voiceTranscriptionOpen = true;
                              NotificationCenter.getInstance(accId).postNotificationName(NotificationCenter.voiceTranscriptionUpdate, targetMsg, null, text, true, true);
                          });
                      });
                      return;
                  }"""

          mc_path = f"{h_dir}/MessagesController.java"
          with open(mc_path, "r", encoding="utf-8") as f:
              mc = f.read()

          mc, ctv_count = re.subn(
              r'(public\s+boolean\s+canTranscribeVoice\s*\([^)]*\)\s*\{)',
              r'\1\n        return true;',
              mc
          )
          print(f"canTranscribeVoice hooks applied: {ctv_count}")
          with open(mc_path, "w", encoding="utf-8") as f:
              f.write(mc)

          whisper_hooks = 0
          for j_path in glob.glob("TMessagesProj/src/main/java/org/telegram/**/*.java", recursive=True):
              with open(j_path, "r", encoding="utf-8") as f:
                  j_code = f.read()

              def repl_transcribe(m):
                  hdr = m.group(0)
                  params_str = m.group(1)
                  for p in params_str.split(","):
                      tokens = p.strip().split()
                      if len(tokens) >= 2 and "MessageObject" in tokens[-2]:
                          var_name = tokens[-1]
                          return hdr + whisper_hook_snippet.replace("msgObject", var_name)
                  return hdr

              j_new, cnt = re.subn(
                  r'public\s+void\s+(?:pressTranscribeButton|transcribeAudio|transcribeVoice)\s*\(([^)]*MessageObject[^)]*)\)\s*\{',
                  repl_transcribe,
                  j_code
              )
              if cnt > 0:
                  with open(j_path, "w", encoding="utf-8") as f:
                      f.write(j_new)
                  whisper_hooks += cnt
                  print(f"Whisper hook added in {j_path}: {cnt}")

          assert whisper_hooks > 0, "No transcribe method with MessageObject found!"

          # 8. Force 120Hz
          au_path = f"{h_dir}/AndroidUtilities.java"
          if os.path.exists(au_path):
              with open(au_path, "r", encoding="utf-8") as f:
                  au = f.read()
              au = au.replace("screenRefreshRate = 60;", "screenRefreshRate = CustomConfig.isForce120Hz() ? 120 : 60;")
              with open(au_path, "w", encoding="utf-8") as f:
                  f.write(au)
          EOF

      - name: Integrate Native Whisper.cpp (Android NDK MediaCodec PCM)
        run: |
          cat << 'EOF' > TMessagesProj/jni/whisper_jni.cpp
          #include <jni.h>
          #include <string>
          #include <vector>
          #include <mutex>
          #include <cstdio>
          #include <cstring>
          #include <media/NdkMediaExtractor.h>
          #include <media/NdkMediaCodec.h>
          #include "whisper/include/whisper.h"

          static std::mutex g_mtx;
          static struct whisper_context *g_ctx = nullptr;
          static std::string g_loaded_model;

          static bool decode_audio_to_pcm16k_mono(const char* path, std::vector<float>& out_pcm) {
              FILE* fp = fopen(path, "rb");
              if (!fp) return false;
              fseek(fp, 0, SEEK_END);
              long size = ftell(fp);
              fseek(fp, 0, SEEK_SET);
              if (size <= 0) {
                  fclose(fp);
                  return false;
              }

              AMediaExtractor* extractor = AMediaExtractor_new();
              media_status_t err = AMediaExtractor_setDataSourceFd(extractor, fileno(fp), 0, size);
              if (err != AMEDIA_OK) {
                  AMediaExtractor_delete(extractor);
                  fclose(fp);
                  return false;
              }

              size_t num_tracks = AMediaExtractor_getTrackCount(extractor);
              int audio_track = -1;
              AMediaFormat* format = nullptr;
              for (size_t i = 0; i < num_tracks; ++i) {
                  AMediaFormat* fmt = AMediaExtractor_getTrackFormat(extractor, i);
                  const char* mime = nullptr;
                  if (AMediaFormat_getString(fmt, AMEDIA_FORMAT_KEY_MIME, &mime) && mime && strncmp(mime, "audio/", 6) == 0) {
                      audio_track = static_cast<int>(i);
                      format = fmt;
                      break;
                  }
                  AMediaFormat_delete(fmt);
              }

              if (audio_track < 0 || !format) {
                  AMediaExtractor_delete(extractor);
                  fclose(fp);
                  return false;
              }

              AMediaExtractor_selectTrack(extractor, audio_track);
              const char* mime = nullptr;
              AMediaFormat_getString(format, AMEDIA_FORMAT_KEY_MIME, &mime);
              int32_t sample_rate = 16000;
              int32_t channel_count = 1;
              AMediaFormat_getInt32(format, AMEDIA_FORMAT_KEY_SAMPLE_RATE, &sample_rate);
              AMediaFormat_getInt32(format, AMEDIA_FORMAT_KEY_CHANNEL_COUNT, &channel_count);

              AMediaCodec* codec = AMediaCodec_createDecoderByType(mime);
              if (!codec || AMediaCodec_configure(codec, format, nullptr, nullptr, 0) != AMEDIA_OK || AMediaCodec_start(codec) != AMEDIA_OK) {
                  if (codec) AMediaCodec_delete(codec);
                  AMediaFormat_delete(format);
                  AMediaExtractor_delete(extractor);
                  fclose(fp);
                  return false;
              }

              std::vector<float> raw_mono;
              bool saw_input_eos = false;
              bool saw_output_eos = false;

              while (!saw_output_eos) {
                  if (!saw_input_eos) {
                      ssize_t in_idx = AMediaCodec_dequeueInputBuffer(codec, 10000);
                      if (in_idx >= 0) {
                          size_t buf_size = 0;
                          uint8_t* buf = AMediaCodec_getInputBuffer(codec, in_idx, &buf_size);
                          ssize_t sample_size = AMediaExtractor_readSampleData(extractor, buf, buf_size);
                          if (sample_size < 0) {
                              AMediaCodec_queueInputBuffer(codec, in_idx, 0, 0, 0, AMEDIACODEC_BUFFER_FLAG_END_OF_STREAM);
                              saw_input_eos = true;
                          } else {
                              int64_t pts = AMediaExtractor_getSampleTime(extractor);
                              AMediaCodec_queueInputBuffer(codec, in_idx, 0, sample_size, pts, 0);
                              AMediaExtractor_advance(extractor);
                          }
                      }
                  }

                  AMediaCodecBufferInfo info;
                  ssize_t out_idx = AMediaCodec_dequeueOutputBuffer(codec, &info, 10000);
                  if (out_idx >= 0) {
                      if (info.flags & AMEDIACODEC_BUFFER_FLAG_END_OF_STREAM) {
                          saw_output_eos = true;
                      }
                      if (info.size > 0) {
                          size_t out_size = 0;
                          uint8_t* out_buf = AMediaCodec_getOutputBuffer(codec, out_idx, &out_size);
                          const int16_t* samples = reinterpret_cast<const int16_t*>(out_buf + info.offset);
                          size_t total_samples = info.size / sizeof(int16_t);
                          size_t frames = total_samples / (channel_count > 0 ? channel_count : 1);
                          for (size_t f = 0; f < frames; ++f) {
                              float sum = 0.0f;
                              for (int c = 0; c < channel_count; ++c) {
                                  sum += static_cast<float>(samples[f * channel_count + c]) / 32768.0f;
                              }
                              raw_mono.push_back(sum / static_cast<float>(channel_count > 0 ? channel_count : 1));
                          }
                      }
                      AMediaCodec_releaseOutputBuffer(codec, out_idx, false);
                  } else if (out_idx == AMEDIACODEC_INFO_OUTPUT_FORMAT_CHANGED) {
                      AMediaFormat* new_fmt = AMediaCodec_getOutputFormat(codec);
                      if (new_fmt) {
                          AMediaFormat_getInt32(new_fmt, AMEDIA_FORMAT_KEY_SAMPLE_RATE, &sample_rate);
                          AMediaFormat_getInt32(new_fmt, AMEDIA_FORMAT_KEY_CHANNEL_COUNT, &channel_count);
                          AMediaFormat_delete(new_fmt);
                      }
                  }
              }

              AMediaCodec_stop(codec);
              AMediaCodec_delete(codec);
              AMediaFormat_delete(format);
              AMediaExtractor_delete(extractor);
              fclose(fp);

              if (raw_mono.empty() || sample_rate <= 0) return false;

              if (sample_rate == 16000) {
                  out_pcm = std::move(raw_mono);
              } else {
                  double ratio = static_cast<double>(sample_rate) / 16000.0;
                  size_t out_len = static_cast<size_t>(raw_mono.size() / ratio);
                  out_pcm.resize(out_len);
                  for (size_t i = 0; i < out_len; ++i) {
                      size_t src_idx = static_cast<size_t>(i * ratio);
                      if (src_idx >= raw_mono.size()) src_idx = raw_mono.size() - 1;
                      out_pcm[i] = raw_mono[src_idx];
                  }
              }
              return !out_pcm.empty();
          }

          extern "C" JNIEXPORT jstring JNICALL
          Java_org_telegram_messenger_WhisperHelper_transcribeNative(JNIEnv* env, jclass clazz, jstring modelPath, jstring audioPath) {
              std::lock_guard<std::mutex> lock(g_mtx);
              const char* m_path = env->GetStringUTFChars(modelPath, nullptr);
              const char* a_path = env->GetStringUTFChars(audioPath, nullptr);

              if (g_ctx == nullptr || g_loaded_model != m_path) {
                  if (g_ctx != nullptr) {
                      whisper_free(g_ctx);
                      g_ctx = nullptr;
                  }
                  struct whisper_context_params cparams = whisper_context_default_params();
                  g_ctx = whisper_init_from_file_with_params(m_path, cparams);
                  g_loaded_model = (g_ctx != nullptr) ? m_path : "";
              }

              if (g_ctx == nullptr) {
                  env->ReleaseStringUTFChars(modelPath, m_path);
                  env->ReleaseStringUTFChars(audioPath, a_path);
                  return env->NewStringUTF("Ошибка инициализации модели Whisper");
              }

              std::vector<float> pcmf32;
              if (!decode_audio_to_pcm16k_mono(a_path, pcmf32)) {
                  env->ReleaseStringUTFChars(modelPath, m_path);
                  env->ReleaseStringUTFChars(audioPath, a_path);
                  return env->NewStringUTF("Ошибка декодирования аудио");
              }

              whisper_full_params wparams = whisper_full_default_params(WHISPER_SAMPLING_GREEDY);
              wparams.language = "ru";
              wparams.n_threads = 4;
              wparams.print_progress = false;
              wparams.print_realtime = false;

              int status = whisper_full(g_ctx, wparams, pcmf32.data(), static_cast<int>(pcmf32.size()));
              env->ReleaseStringUTFChars(modelPath, m_path);
              env->ReleaseStringUTFChars(audioPath, a_path);

              if (status != 0) {
                  return env->NewStringUTF("Ошибка распознавания речи");
              }

              std::string result;
              int n_seg = whisper_full_n_segments(g_ctx);
              for (int i = 0; i < n_seg; ++i) {
                  const char* seg = whisper_full_get_segment_text(g_ctx, i);
                  if (seg) result += seg;
              }
              return env->NewStringUTF(result.c_str());
          }
          EOF

          python3 - << 'EOF'
          import re
          cm_path = "TMessagesProj/jni/CMakeLists.txt"
          with open(cm_path, "r", encoding="utf-8") as f:
              cm = f.read()
          m = re.search(r'add_library\(\s*([^\s\)]+)', cm)
          tgt = m.group(1) if m else "tmessages.49"
          print(f"Detected CMake target: {tgt}")
          addition = f"""
          set(BUILD_SHARED_LIBS OFF CACHE BOOL "" FORCE)
          set(WHISPER_BUILD_TESTS OFF CACHE BOOL "" FORCE)
          set(WHISPER_BUILD_EXAMPLES OFF CACHE BOOL "" FORCE)
          set(GGML_OPENMP OFF CACHE BOOL "" FORCE)
          add_subdirectory(whisper)
          target_sources({tgt} PRIVATE whisper_jni.cpp)
          target_include_directories({tgt} PRIVATE whisper/include whisper/ggml/include)
          target_link_libraries({tgt} whisper mediandk)
          """
          if "whisper_jni.cpp" not in cm:
              with open(cm_path, "w", encoding="utf-8") as f:
                  f.write(cm + addition)
          EOF

          cat << 'EOF' > TMessagesProj/src/main/java/org/telegram/messenger/WhisperHelper.java
          package org.telegram.messenger;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;

          public class WhisperHelper {
              private static final String MODEL_NAME = "ggml-small-q5_1.bin";
              private static final String MODEL_URL = "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small-q5_1.bin";

              public static native String transcribeNative(String modelPath, String audioPath);

              public static String transcribeFile(File audioFile) {
                  try {
                      File dir = new File(ApplicationLoader.applicationContext.getFilesDir(), "whisper");
                      if (!dir.exists() && !dir.mkdirs()) {
                          return "Не удалось создать директорию модели";
                      }
                      File model = new File(dir, MODEL_NAME);
                      if (!model.exists() || model.length() < 150000000L) {
                          File tmp = new File(dir, MODEL_NAME + ".tmp");
                          HttpURLConnection conn = (HttpURLConnection) new URL(MODEL_URL).openConnection();
                          conn.setInstanceFollowRedirects(true);
                          conn.setConnectTimeout(15000);
                          conn.setReadTimeout(60000);
                          try (InputStream in = conn.getInputStream(); FileOutputStream out = new FileOutputStream(tmp)) {
                              byte[] buf = new byte[8192];
                              int len;
                              while ((len = in.read(buf)) != -1) {
                                  out.write(buf, 0, len);
                              }
                          }
                          if (!tmp.renameTo(model)) {
                              return "Не удалось сохранить модель";
                          }
                      }
                      return transcribeNative(model.getAbsolutePath(), audioFile.getAbsolutePath());
                  } catch (Exception e) {
                      return "Ошибка Whisper: " + e.getMessage();
                  }
              }
          }
          EOF

      - name: Build arm64 Release APK
        env:
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          SIGN_ARGS=""
          if [ -f "TMessagesProj/my_telegram.jks" ] && [ -n "$STORE_PASS" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASS" ]; then
            SIGN_ARGS="-Pandroid.injected.signing.store.file=my_telegram.jks -Pandroid.injected.signing.store.password=$STORE_PASS -Pandroid.injected.signing.key.alias=$KEY_ALIAS -Pandroid.injected.signing.key.password=$KEY_PASS"
          fi
          ./gradlew :TMessagesProj_App:assembleAfatRelease --max-workers=4 $SIGN_ARGS

      - name: Verify APK Package Name
        run: |
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | head -n 1)
          APK_FILE=$(find TMessagesProj_App/build/outputs/apk -name "*.apk" | head -n 1)
          echo "APK Path: $APK_FILE"
          test -n "$APK_FILE"
          "$AAPT2" dump badging "$APK_FILE" | grep -E "package:|application-label:"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NotesClient-arm64
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
