              "          compactSwitch.setChecked(CustomConfig.isCompactMessageSpacing());",
              "          selectedSlot[0] = 0; hexInput.setText(CustomConfig.formatHex(CustomConfig.getAccentColor())); refreshPreview.run();",
              "        }",
              "      });",
              "      root.addView(resetBtn);",
              "      new AlertDialog.Builder(activity).setTitle(\"Notes - Панель настройки тем\").setView(scroll).setPositiveButton(\"Готово\", null).show();",
              "    } catch (Throwable ignored) {}",
              "  }",
              "  public static void refreshDisplayAndGuestGuard(Activity activity) {",
              "    if (activity == null) return;",
              "    try {",
              "      Window w = activity.getWindow();",
              "      if (w != null) {",
              "        if (CustomConfig.isGuestHandoverActive()) { w.addFlags(WindowManager.LayoutParams.FLAG_SECURE); } else { w.clearFlags(WindowManager.LayoutParams.FLAG_SECURE); }",
              "        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {",
              "          WindowManager.LayoutParams params = w.getAttributes();",
              "          params.preferredRefreshRate = CustomConfig.isForce120Hz() ? 120.0f : 0.0f;",
              "          if (CustomConfig.isMagicHdrBoost() && CustomConfig.isHonorMagic6Pro()) { params.screenBrightness = Math.max(params.screenBrightness, 0.85f); }",
              "          w.setAttributes(params);",
              "        }",
              "      }",
              "    } catch (Throwable ignored) {}",
              "  }",
              "  public static void triggerPorscheTick(int amplitude, int durationMs) {",
              "    try {",
              "      if (!CustomConfig.isPorscheHapticBoost()) return;",
              "      Context ctx = ApplicationLoader.applicationContext;",
              "      if (ctx == null) return;",
              "      Vibrator vib = (Vibrator) ctx.getSystemService(Context.VIBRATOR_SERVICE);",
              "      if (vib != null && vib.hasVibrator()) {",
              "        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {",
              "          vib.vibrate(VibrationEffect.createOneShot(Math.max(10, Math.min(400, durationMs)), Math.max(1, Math.min(255, amplitude))));",
              "        } else { vib.vibrate(Math.max(10, Math.min(400, durationMs))); }",
              "      }",
              "    } catch (Throwable ignored) {}",
              "  }",
              "  public static void copyTextToClipboard(Context ctx, String label, String text) {",
              "    try {",
              "      if (ctx == null || TextUtils.isEmpty(text)) return;",
              "      ClipboardManager cm = (ClipboardManager) ctx.getSystemService(Context.CLIPBOARD_SERVICE);",
              "      if (cm != null) cm.setPrimaryClip(ClipData.newPlainText(label != null ? label : \"Notes\", text));",
              "    } catch (Throwable ignored) {}",
              "  }",
              "  public static File saveSecretMediaToVault(String sourcePath, boolean isVideo) {",
              "    try {",
              "      if (CustomConfig.isGuestHandoverActive() || TextUtils.isEmpty(sourcePath)) return null;",
              "      File src = new File(sourcePath);",
              "      if (!src.exists() || !src.canRead()) return null;",
              "      File baseDir = Environment.getExternalStoragePublicDirectory(isVideo ? Environment.DIRECTORY_MOVIES : Environment.DIRECTORY_PICTURES);",
              "      File vaultDir = new File(baseDir, \"NotesVault\");",
              "      if (!vaultDir.exists() && !vaultDir.mkdirs()) return null;",
              "      File dst = new File(vaultDir, (isVideo ? \"vault_vid_\" : \"vault_img_\") + System.currentTimeMillis() + (isVideo ? \".mp4\" : \".jpg\"));",
              "      try (FileInputStream in = new FileInputStream(src); FileOutputStream out = new FileOutputStream(dst)) {",
              "        byte[] buf = new byte[16384]; int len;",
              "        while ((len = in.read(buf)) > 0) out.write(buf, 0, len);",
              "      }",
              "      return dst;",
              "    } catch (Throwable ignored) { return null; }",
              "  }",
              "  public static File decodeMediaToMono16kWav(String inputPath) {",
              "    try {",
              "      if (TextUtils.isEmpty(inputPath)) return null;",
              "      File inFile = new File(inputPath);",
              "      if (!inFile.exists()) return null;",
              "      File outWav = new File(ApplicationLoader.applicationContext.getCacheDir(), \"whisper_ru_16k.wav\");",
              "      MediaExtractor extractor = new MediaExtractor();",
              "      extractor.setDataSource(inputPath);",
              "      int audioTrack = -1;",
              "      for (int i = 0; i < extractor.getTrackCount(); i++) {",
              "        MediaFormat fmt = extractor.getTrackFormat(i);",
              "        String mime = fmt.getString(MediaFormat.KEY_MIME);",
              "        if (mime != null && mime.startsWith(\"audio/\")) { audioTrack = i; break; }",
              "      }",
              "      if (audioTrack < 0) { extractor.release(); return inFile; }",
              "      extractor.selectTrack(audioTrack);",
              "      MediaFormat format = extractor.getTrackFormat(audioTrack);",
              "      MediaCodec codec = MediaCodec.createDecoderByType(format.getString(MediaFormat.KEY_MIME));",
              "      codec.configure(format, null, null, 0);",
              "      codec.start();",
              "      ByteArrayOutputStream pcmOut = new ByteArrayOutputStream();",
              "      MediaCodec.BufferInfo info = new MediaCodec.BufferInfo();",
              "      boolean sawInputEOS = false; boolean sawOutputEOS = false;",
              "      while (!sawOutputEOS) {",
              "        if (!sawInputEOS) {",
              "          int inIdx = codec.dequeueInputBuffer(10000);",
              "          if (inIdx >= 0) {",
              "            ByteBuffer inBuf = codec.getInputBuffer(inIdx);",
              "            int sampleSize = extractor.readSampleData(inBuf, 0);",
              "            if (sampleSize < 0) { codec.queueInputBuffer(inIdx, 0, 0, 0L, MediaCodec.BUFFER_FLAG_END_OF_STREAM); sawInputEOS = true; }",
              "            else { codec.queueInputBuffer(inIdx, 0, sampleSize, extractor.getSampleTime(), 0); extractor.advance(); }",
              "          }",
              "        }",
              "        int outIdx = codec.dequeueOutputBuffer(info, 10000);",
              "        if (outIdx >= 0) {",
              "          ByteBuffer outBuf = codec.getOutputBuffer(outIdx);",
              "          if (outBuf != null && info.size > 0) { byte[] chunk = new byte[info.size]; outBuf.get(chunk); pcmOut.write(chunk); }",
              "          codec.releaseOutputBuffer(outIdx, false);",
              "          if ((info.flags & MediaCodec.BUFFER_FLAG_END_OF_STREAM) != 0) sawOutputEOS = true;",
              "        }",
              "      }",
              "      codec.stop(); codec.release(); extractor.release();",
              "      byte[] pcmData = pcmOut.toByteArray();",
              "      int sampleRate = format.containsKey(MediaFormat.KEY_SAMPLE_RATE) ? format.getInteger(MediaFormat.KEY_SAMPLE_RATE) : 16000;",
              "      int channels = format.containsKey(MediaFormat.KEY_CHANNEL_COUNT) ? format.getInteger(MediaFormat.KEY_CHANNEL_COUNT) : 1;",
              "      try (FileOutputStream fos = new FileOutputStream(outWav)) { writeWavHeader(fos, pcmData.length, sampleRate, channels, 16); fos.write(pcmData); }",
              "      return outWav;",
              "    } catch (Throwable ignored) { return new File(inputPath); }",
              "  }",
              "  private static void writeWavHeader(FileOutputStream out, int pcmBytes, int sampleRate, int channels, int bitsPerSample) throws Exception {",
              "    int byteRate = sampleRate * channels * bitsPerSample / 8;",
              "    int blockAlign = channels * bitsPerSample / 8;",
              "    ByteBuffer header = ByteBuffer.allocate(44).order(ByteOrder.LITTLE_ENDIAN);",
              "    header.put(new byte[] {'R', 'I', 'F', 'F'}); header.putInt(36 + pcmBytes); header.put(new byte[] {'W', 'A', 'V', 'E'});",
              "    header.put(new byte[] {'f', 'm', 't', ' '}); header.putInt(16); header.putShort((short) 1); header.putShort((short) channels);",
              "    header.putInt(sampleRate); header.putInt(byteRate); header.putShort((short) blockAlign); header.putShort((short) bitsPerSample);",
              "    header.put(new byte[] {'d', 'a', 't', 'a'}); header.putInt(pcmBytes); out.write(header.array());",
              "  }",
              "  public static void transcribeAudioOrRound(Activity activity, long dialogId, String mediaPath, boolean isRoundVideo) {",
              "    if (activity == null || CustomConfig.isStockMode(dialogId)) return;",
              "    try {",
              "      File prepared = CustomConfig.isLocalWhisperRu() ? decodeMediaToMono16kWav(mediaPath) : (mediaPath != null ? new File(mediaPath) : null);",
              "      File target = (prepared != null && prepared.exists()) ? prepared : (mediaPath != null ? new File(mediaPath) : null);",
              "      if (target == null || !target.exists()) return;",
              "      Context ctx = activity.getApplicationContext();",
              "      Uri uri = FileProvider.getUriForFile(ctx, ctx.getPackageName() + \".provider\", target);",
              "      Intent send = new Intent(Intent.ACTION_SEND);",
              "      send.setType(isRoundVideo ? \"video/*\" : \"audio/*\");",
              "      send.putExtra(Intent.EXTRA_STREAM, uri);",
              "      send.putExtra(\"language\", \"ru\");",
              "      send.putExtra(\"whisper_model\", MODEL_ASSET_PATH);",
              "      send.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);",
              "      activity.startActivity(Intent.createChooser(send, \"Расшифровать (RU)\"));",
              "    } catch (Throwable ignored) {}",
              "  }",
              "}"
          ]
          with open(f"{h_dir}/LocalWhisperHelper.java", "w", encoding="utf-8") as f:
              f.write("\n".join(whisper_lines) + "\n")
          diag("WHISPER", f"Wrote {h_dir}/LocalWhisperHelper.java ({len(whisper_lines)} lines)")

          # 9. Patch MessagesStorage & MessagesController
          for ms_path in glob.glob("TMessagesProj/src/main/java/**/MessagesStorage.java", recursive=True):
