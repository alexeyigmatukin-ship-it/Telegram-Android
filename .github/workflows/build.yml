              }

              public static boolean isDeletedLocally(long dialogId, int msgId) {
                  Set<String> set = getDeletedSet();
                  return set.contains(dialogId + "_" + msgId) || set.contains("0_" + msgId);
              }

              public static void saveEditedSnapshot(long dialogId, int msgId, String previousText) {
                  if (previousText == null || previousText.trim().isEmpty()) return;
                  String key = dialogId + "_" + msgId;
                  if (!editedHistory.containsKey(key)) {
                      editedHistory.put(key, previousText);
                  }
              }

              public static boolean hasEditedSnapshot(long dialogId, int msgId) {
                  return editedHistory.containsKey(dialogId + "_" + msgId);
              }

              public static String getEditedSnapshot(long dialogId, int msgId) {
                  return editedHistory.get(dialogId + "_" + msgId);
              }
