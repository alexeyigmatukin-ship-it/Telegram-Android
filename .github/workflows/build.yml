name: Build Custom Stealth Client APK v3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free Up Disk Space & Speed Up Runner
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk/* /opt/ghc /usr/local/.ghcup /usr/local/share/powershell /usr/local/lib/node_modules || true
          df -h

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Decode or Generate Valid Keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p TMessagesProj
          KS_PATH="$(pwd)/TMessagesProj/my_telegram.jks"
          STORE_PASS="${KS_STORE_PASS:-android123}"
          KEY_ALIAS="${KS_KEY_ALIAS:-telegram}"
          KEY_PASS="${KS_KEY_PASS:-$STORE_PASS}"

          VALID_KS=0
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > "$KS_PATH" || true
            if keytool -list -keystore "$KS_PATH" -storepass "$STORE_PASS" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
              echo "[v3][KEYSTORE] Decoded keystore verified successfully for alias '$KEY_ALIAS'."
              VALID_KS=1
            else
              echo "[v3][KEYSTORE] Warning: Provided keystore or alias '$KEY_ALIAS' failed verification."
              DETECTED_ALIAS=$(keytool -list -keystore "$KS_PATH" -storepass "$STORE_PASS" 2>/dev/null | grep -E "PrivateKeyEntry|keyEntry" | head -n 1 | cut -d',' -f1 | tr -d '[:space:]')
              if [ -n "$DETECTED_ALIAS" ]; then
                echo "[v3][KEYSTORE] Auto-detected alias inside keystore: $DETECTED_ALIAS"
                KEY_ALIAS="$DETECTED_ALIAS"
                VALID_KS=1
              fi
            fi
          fi

          if [ "$VALID_KS" -eq 0 ]; then
            echo "[v3][KEYSTORE] Generating fresh fallback release keystore..."
            rm -f "$KS_PATH"
            STORE_PASS="android123"
            KEY_ALIAS="telegram"
            KEY_PASS="android123"
            keytool -genkeypair -v \
              -keystore "$KS_PATH" \
              -storepass "$STORE_PASS" \
              -alias "$KEY_ALIAS" \
              -keypass "$KEY_PASS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Notes, OU=Dev, O=Custom, L=City, S=State, C=US"
          fi

          echo "EFFECTIVE_STORE_PASS=$STORE_PASS" >> "$GITHUB_ENV"
          echo "EFFECTIVE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "EFFECTIVE_KEY_PASS=$KEY_PASS" >> "$GITHUB_ENV"

      - name: Prepare Local Whisper Russian Model
        run: |
          python3 - << 'EOF'
          import os, urllib.request

          whisper_dir = "TMessagesProj/src/main/assets/whisper"
          os.makedirs(whisper_dir, exist_ok=True)
          model_path = os.path.join(whisper_dir, "ggml-small-q5_1.bin")
          model_url = "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small-q5_1.bin"

          if not os.path.exists(model_path):
              try:
                  print("[v3][WHISPER] Downloading Russian-capable local Whisper model (ggml-small-q5_1.bin)...")
                  req = urllib.request.Request(model_url, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=120) as resp, open(model_path, "wb") as out:
                      out.write(resp.read())
                  print(f"[v3][WHISPER] Downloaded model to {model_path} ({os.path.getsize(model_path)} bytes)")
              except Exception as e:
                  print(f"[v3][WHISPER][WARN] Could not pre-download Whisper model during build ({e}).")
          else:
              print(f"[v3][WHISPER] Model already present at {model_path} ({os.path.getsize(model_path)} bytes)")
          EOF

      - name: Apply Stealth, Anti-Delete, Secret Media, Local RU Whisper, Local Premium, Guest Mode & Telegram-Style Notes Hub Patches (v3)
        env:
          RAW_API_ID: ${{ secrets.TG_API_ID }}
          RAW_API_HASH: ${{ secrets.TG_API_HASH }}
          NEW_PKG: "com.alexey.notesclient"
          NEW_NAME: "Notes"
        run: |
          mkdir -p v3_diagnostics
          python3 - << 'EOF' | tee v3_diagnostics/patch_report.log
          import os, re, glob, json, copy

          def diag(tag, msg):
              print(f"[v3][{tag}] {msg}", flush=True)

          def find_matching_brace(text, open_brace_idx):
              depth = 0
              in_str = False
              str_ch = ''
              esc = False
              i = open_brace_idx
              n = len(text)
              while i < n:
                  ch = text[i]
                  if in_str:
                      if esc:
                          esc = False
                      elif ch == '\\':
                          esc = True
                      elif ch == str_ch:
                          in_str = False
                  else:
                      if ch in ('"', "'"):
                          in_str = True
                          str_ch = ch
                      elif ch == '{':
                          depth += 1
                      elif ch == '}':
                          depth -= 1
                          if depth == 0:
                              return i
                  i += 1
              return -1

          def inject_into_method_body(src, method_pattern, snippet, marker):
              if marker in src:
                  return src, 0, "already_present"
              m = re.search(method_pattern, src)
              if not m:
                  return src, 0, "method_not_found"
              brace_idx = src.find("{", m.end() - 1)
              if brace_idx == -1:
                  return src, 0, "no_open_brace"
              close_idx = find_matching_brace(src, brace_idx)
              if close_idx == -1:
                  return src, 0, "no_close_brace"
              return src[:close_idx] + "\n" + snippet + "\n" + src[close_idx:], 1, "injected_before_close"

          raw_api_id = os.environ.get("RAW_API_ID", "").strip()
          api_id = raw_api_id if raw_api_id.isdigit() else "2040"
          api_hash = os.environ.get("RAW_API_HASH", "").strip() or "b18441a1ff607e10a989891a5462e627"
          new_pkg = os.environ.get("NEW_PKG", "com.alexey.notesclient").strip()
          new_name = os.environ.get("NEW_NAME", "Notes").strip()

          diag("DIAG", f"Workflow version: v3 | target pkg={new_pkg} | name={new_name}")
          diag("DIAG", f"Exists TMessagesProj={os.path.isdir('TMessagesProj')} | TMessagesProj_App={os.path.isdir('TMessagesProj_App')}")

          # 0. Maven Central Mirror fallback to avoid HTTP 429
          mirror_snippet = 'maven { url "https://maven-central.storage-download.googleapis.com/maven2" }\n        mavenCentral()'
          mirror_kts_snippet = 'maven("https://maven-central.storage-download.googleapis.com/maven2")\n        mavenCentral()'

          for g_file in glob.glob("**/*.gradle*", recursive=True):
              if "/build/" in g_file or "\\build\\" in g_file or "/.gradle/" in g_file:
                  continue
              try:
                  with open(g_file, "r", encoding="utf-8") as f:
                      content = f.read()
              except Exception:
                  continue
              new_content = content
              if g_file.endswith(".kts"):
                  new_content = re.sub(r'\bmavenCentral\(\)', mirror_kts_snippet, new_content)
              else:
                  new_content = re.sub(r'\bmavenCentral\(\)', mirror_snippet, new_content)
              new_content = new_content.replace("https://repo.maven.apache.org/maven2", "https://maven-central.storage-download.googleapis.com/maven2")
              new_content = new_content.replace("https://repo1.maven.org/maven2", "https://maven-central.storage-download.googleapis.com/maven2")
              if new_content != content:
                  with open(g_file, "w", encoding="utf-8") as f:
                      f.write(new_content)

          # 1. API Keys & Hardcoded APPLICATION_ID in BuildVars.java / ApplicationLoader.java
          bv_path = "TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java"
          if os.path.exists(bv_path):
              with open(bv_path, "r", encoding="utf-8") as f:
                  bv = f.read()
              bv = re.sub(r'(public\s+static\s+int\s+APP_ID\s*=\s*)[^;]+;', rf'\g<1>{api_id};', bv)
              bv = re.sub(r'(public\s+static\s+String\s+APP_HASH\s*=\s*)[^;]+;', rf'\g<1>"{api_hash}";', bv)
              bv = re.sub(r'(public\s+static\s+String\s+APPLICATION_ID\s*=\s*)["\'][^"\']*["\'];', rf'\g<1>"{new_pkg}";', bv)
              with open(bv_path, "w", encoding="utf-8") as f:
                  f.write(bv)
              diag("BUILDVARS", f"Updated {bv_path} with pkg={new_pkg}")
          else:
              diag("BUILDVARS", f"MISS {bv_path}")

          al_path = "TMessagesProj/src/main/java/org/telegram/messenger/ApplicationLoader.java"
          if os.path.exists(al_path):
              with open(al_path, "r", encoding="utf-8") as f:
                  al = f.read()
              if f'if (true) return "{new_pkg}";' not in al:
                  al, cnt = re.subn(
                      r'(public\s+static\s+String\s+getApplicationId\s*\(\s*\)\s*\{)',
                      rf'\1\n        if (true) return "{new_pkg}";',
                      al,
                      count=1
                  )
                  with open(al_path, "w", encoding="utf-8") as f:
                      f.write(al)
                  diag("APPLOADER", f"Patched getApplicationId count={cnt}")
          else:
              diag("APPLOADER", f"MISS {al_path}")

          # 2. Standalone Package ID, Flavor Suffixes & Authorities across Gradle & buildSrc
          for gf_path in glob.glob("**/*.gradle*", recursive=True) + glob.glob("buildSrc/**/*.kt", recursive=True):
              if "/build/" in gf_path or "\\build\\" in gf_path or "/.gradle/" in gf_path:
                  continue
              try:
                  with open(gf_path, "r", encoding="utf-8") as f:
                      gf = f.read()
              except Exception:
                  continue
              gf_new = re.sub(
                  r'applicationId\s*=?\s*["\']org\.telegram\.messenger[^"\']*["\']',
                  f'applicationId = "{new_pkg}"' if gf_path.endswith(".kt") or gf_path.endswith(".kts") else f'applicationId "{new_pkg}"',
                  gf
              )
              gf_new = re.sub(
                  r'applicationIdSuffix\s*=?\s*["\'][^"\']*["\']',
                  '',
                  gf_new
              )
              for suff in ["provider", "call_provider", "notification_image_provider", "beta_provider"]:
                  gf_new = gf_new.replace(f"org.telegram.messenger.{suff}", f"{new_pkg}.{suff}")
              gf_new = gf_new.replace("org.telegram.messenger.permission.", f"{new_pkg}.permission.")
              if gf_new != gf:
                  with open(gf_path, "w", encoding="utf-8") as f:
                      f.write(gf_new)

          # 3. Force applicationId, arm64-only ABI filter & Release Signing on TMessagesProj_App
          app_id_and_signing_patch = f"""
          if (project.hasProperty("android")) {{
              project.android {{
                  defaultConfig {{
                      applicationId "{new_pkg}"
                      ndk {{
                          abiFilters "arm64-v8a"
                      }}
                  }}
                  productFlavors.all {{ flavor ->
                      if (flavor.hasProperty("applicationId")) {{
                          flavor.applicationId = "{new_pkg}"
                      }}
                      if (flavor.hasProperty("applicationIdSuffix")) {{
                          flavor.applicationIdSuffix = null
                      }}
                  }}
                  signingConfigs {{
                      def relCfg = findByName("release") ?: create("release")
                      relCfg.storeFile = project.rootProject.file("TMessagesProj/my_telegram.jks")
                      relCfg.storePassword = System.getenv("EFFECTIVE_STORE_PASS") ?: "android123"
                      relCfg.keyAlias = System.getenv("EFFECTIVE_KEY_ALIAS") ?: "telegram"
                      relCfg.keyPassword = System.getenv("EFFECTIVE_KEY_PASS") ?: "android123"
                  }}
                  buildTypes {{
                      release {{
                          signingConfig signingConfigs.release
                      }}
                  }}
              }}
          }}
          """
          if os.path.exists("TMessagesProj_App/build.gradle"):
              with open("TMessagesProj_App/build.gradle", "r", encoding="utf-8") as f:
                  mg = f.read()
              if "my_telegram.jks" not in mg:
                  with open("TMessagesProj_App/build.gradle", "w", encoding="utf-8") as f:
                      f.write(mg + "\n" + app_id_and_signing_patch)
                  diag("APP_GRADLE", "Appended package/ABI/signing block to TMessagesProj_App/build.gradle")

          # 4. google-services.json
          for gs_path in glob.glob("**/google-services.json", recursive=True):
              if "/build/" in gs_path or "\\build\\" in gs_path:
                  continue
              try:
                  with open(gs_path, "r", encoding="utf-8") as f:
                      gs = json.load(f)
                  clients = gs.get("client")
                  if isinstance(clients, list):
                      existing_pkgs = {
                          c.get("client_info", {}).get("android_client_info", {}).get("package_name", "")
                          for c in clients
                      }
                      if new_pkg not in existing_pkgs:
                          for c in list(clients):
                              pkg = c.get("client_info", {}).get("android_client_info", {}).get("package_name", "")
                              if pkg == "org.telegram.messenger":
                                  cloned = copy.deepcopy(c)
                                  cloned["client_info"]["android_client_info"]["package_name"] = new_pkg
                                  clients.append(cloned)
                                  break
                  with open(gs_path, "w", encoding="utf-8") as f:
                      json.dump(gs, f, indent=2)
              except Exception as e:
                  diag("GOOGLESVC", f"Skip {gs_path}: {e}")

          # 5. AndroidManifest & XML authorities/permissions/providers + Honor Magic 6 Pro Multiwindow/Aspect
          for mf_path in glob.glob("**/AndroidManifest.xml", recursive=True):
              if "/build/" in mf_path or "\\build\\" in mf_path:
                  continue
              try:
                  with open(mf_path, "r", encoding="utf-8") as f:
                      mf = f.read()
              except Exception:
                  continue
              for suff in [
                  "provider",
                  "call_provider",
                  "notification_image_provider",
                  "beta_provider",
                  "permission.MAPS_RECEIVE",
                  "permission.C2D_MESSAGE",
                  "DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION",
              ]:
                  mf = mf.replace(f"org.telegram.messenger.{suff}", f"{new_pkg}.{suff}")
              mf = re.sub(
                  r'(android:authorities=["\'])org\.telegram\.messenger\.([^"\']+)(["\'])',
                  rf'\g<1>{new_pkg}.\g<2>\g<3>',
                  mf
              )
              if "</application>" in mf and "android.max_aspect" not in mf:
                  mf = mf.replace(
                      "</application>",
                      '    <meta-data android:name="android.max_aspect" android:value="2.5" />\n    <meta-data android:name="com.hihonor.support.multiwindow" android:value="true" />\n  </application>',
                      1
                  )
              with open(mf_path, "w", encoding="utf-8") as f:
                  f.write(mf)

          for rx_path in glob.glob("**/res/xml/*.xml", recursive=True):
              if "/build/" in rx_path or "\\build\\" in rx_path:
                  continue
              try:
                  with open(rx_path, "r", encoding="utf-8") as f:
                      rx = f.read()
              except Exception:
                  continue
              if "org.telegram.messenger" in rx:
                  rx = rx.replace("org.telegram.messenger", new_pkg)
                  with open(rx_path, "w", encoding="utf-8") as f:
                      f.write(rx)

          # 6. AppName
          for xml_path in glob.glob("TMessagesProj*/src/main/res/values*/strings.xml"):
              try:
                  with open(xml_path, "r", encoding="utf-8") as f:
                      xml = f.read()
              except Exception:
                  continue
              xml = re.sub(r'<string name="AppName">[^<]*</string>', f'<string name="AppName">{new_name}</string>', xml)
              xml = re.sub(r'<string name="AppNameBeta">[^<]*</string>', f'<string name="AppNameBeta">{new_name}</string>', xml)
              with open(xml_path, "w", encoding="utf-8") as f:
                  f.write(xml)

          # 7. CustomConfig
          h_dir = "TMessagesProj/src/main/java/org/telegram/messenger"
          os.makedirs(h_dir, exist_ok=True)
          custom_cfg_code = """package org.telegram.messenger;

          import android.content.Context;
          import android.content.SharedPreferences;
          import android.os.Build;
          import java.util.Collections;
          import java.util.HashMap;
          import java.util.HashSet;
          import java.util.Map;
          import java.util.Set;

          public class CustomConfig {
              private static Set<String> deletedIds = null;
              private static final Map<String, String> editedHistory = Collections.synchronizedMap(new HashMap<>());

              public static final int[] SWATCH_PALETTE = new int[] {
                  0xFF3390EC, 0xFFE11D48, 0xFF38BDF8, 0xFF10B981, 0xFFF59E0B,
                  0xFFA855F7, 0xFFEC4899, 0xFF6366F1, 0xFFF97316, 0xFF14B8A6
              };

              public static final int[] SURFACE_PALETTE = new int[] {
                  0xFF18222D, 0xFF0F161E, 0xFF000000, 0xFF161213, 0xFF101815, 0xFF181520
              };

              public static final int[] BUBBLE_PALETTE = new int[] {
                  0xFF212D3B, 0xFF2B5278, 0xFF1E293B, 0xFF2A1419, 0xFF112622, 0xFF1F192E
              };

              private static SharedPreferences getPrefs() {
                  return ApplicationLoader.applicationContext.getSharedPreferences("my_custom_prefs", Context.MODE_PRIVATE);
              }

              private static synchronized Set<String> getDeletedSet() {
                  if (deletedIds == null) {
                      Set<String> saved = getPrefs().getStringSet("deleted_msgs_set", null);
                      deletedIds = Collections.synchronizedSet(saved != null ? new HashSet<>(saved) : new HashSet<>());
                  }
                  return deletedIds;
              }

              public static boolean isStockMode(long dialogId) {
                  return getPrefs().getBoolean("stock_" + dialogId, false);
              }

              public static void toggleStockMode(long dialogId) {
                  getPrefs().edit().putBoolean("stock_" + dialogId, !isStockMode(dialogId)).apply();
              }

              public static boolean isGhostRead(long dialogId) {
                  if (isStockMode(dialogId) || isGuestHandoverActive()) return false;
                  return getPrefs().getBoolean("ghost_read", false);
              }

              public static void toggleGhostRead() {
                  getPrefs().edit().putBoolean("ghost_read", !getPrefs().getBoolean("ghost_read", false)).apply();
              }

              public static boolean isNoTyping(long dialogId) {
                  if (isStockMode(dialogId) || isGuestHandoverActive()) return false;
                  return getPrefs().getBoolean("no_typing", false);
              }

              public static void toggleNoTyping() {
                  getPrefs().edit().putBoolean("no_typing", !getPrefs().getBoolean("no_typing", false)).apply();
              }

              public static boolean isLocalPremiumEnabled() {
                  return getPrefs().getBoolean("local_premium_enabled", true);
              }

              public static boolean toggleLocalPremium() {
                  boolean next = !isLocalPremiumEnabled();
                  getPrefs().edit()
                      .putBoolean("local_premium_enabled", next)
                      .putBoolean("prem_badge", next)
                      .putBoolean("prem_no_ads", next)
                      .putBoolean("prem_fast_dl", next)
                      .putBoolean("prem_translate", next)
                      .putBoolean("prem_stories_stealth", next)
                      .putBoolean("prem_emoji_react", next)
                      .apply();
                  return next;
              }

              public static void armGuestHandoverTimer(int minutes) {
                  int safeMinutes = Math.max(1, Math.min(60, minutes));
                  long until = System.currentTimeMillis() + safeMinutes * 60_000L;
                  getPrefs().edit()
                      .putLong("guest_handover_until", until)
                      .putBoolean("guest_mode_active", true)
                      .apply();
              }

              public static void disarmGuestHandover() {
                  getPrefs().edit()
                      .putLong("guest_handover_until", 0L)
                      .putBoolean("guest_mode_active", false)
                      .apply();
              }

              public static boolean isGuestHandoverActive() {
                  if (!getPrefs().getBoolean("guest_mode_active", false)) return false;
                  long until = getPrefs().getLong("guest_handover_until", 0L);
                  if (System.currentTimeMillis() > until) {
                      disarmGuestHandover();
                      return false;
                  }
                  return true;
              }

              public static long getGuestRemainingSeconds() {
                  if (!isGuestHandoverActive()) return 0L;
                  long rem = (getPrefs().getLong("guest_handover_until", 0L) - System.currentTimeMillis()) / 1000L;
                  return Math.max(0L, rem);
              }

              public static int getPhotoSendQuality() {
                  return getPrefs().getInt("media_photo_quality", 1);
              }

              public static void setPhotoSendQuality(int mode) {
                  getPrefs().edit().putInt("media_photo_quality", Math.max(0, Math.min(2, mode))).apply();
              }

              public static int getVideoSendProfile() {
                  return getPrefs().getInt("media_video_profile", 1);
              }

              public static void setVideoSendProfile(int profile) {
                  getPrefs().edit().putInt("media_video_profile", Math.max(0, Math.min(2, profile))).apply();
              }

              public static boolean isSendMediaAsFile() {
                  return getPrefs().getBoolean("media_send_as_file", false);
              }

              public static void toggleSendMediaAsFile() {
                  getPrefs().edit().putBoolean("media_send_as_file", !isSendMediaAsFile()).apply();
              }

              public static boolean isSendMediaSilently() {
                  return getPrefs().getBoolean("media_send_silently", false);
              }

              public static void toggleSendMediaSilently() {
                  getPrefs().edit().putBoolean("media_send_silently", !isSendMediaSilently()).apply();
              }

              public static boolean isStripMediaExif() {
                  return getPrefs().getBoolean("media_strip_exif", true);
              }

              public static void toggleStripMediaExif() {
                  getPrefs().edit().putBoolean("media_strip_exif", !isStripMediaExif()).apply();
              }

              public static boolean isAutoBackupSentToVault() {
                  return getPrefs().getBoolean("media_auto_backup_vault", false);
              }

              public static void toggleAutoBackupSentToVault() {
                  getPrefs().edit().putBoolean("media_auto_backup_vault", !isAutoBackupSentToVault()).apply();
              }

              public static int getSpoilerMediaMode() {
                  return getPrefs().getInt("media_spoiler_mode", 0);
              }

              public static void setSpoilerMediaMode(int mode) {
                  getPrefs().edit().putInt("media_spoiler_mode", Math.max(0, Math.min(2, mode))).apply();
              }

              public static int getAccentColor() {
                  return getPrefs().getInt("custom_accent_color", 0xFF3390EC);
              }

              public static void setAccentColor(int color) {
                  getPrefs().edit().putInt("custom_accent_color", color).apply();
              }

              public static int getSurfaceColor() {
                  return getPrefs().getInt("custom_surface_color", 0xFF18222D);
              }

              public static void setSurfaceColor(int color) {
                  getPrefs().edit().putInt("custom_surface_color", color).apply();
              }

              public static int getBubbleColor() {
                  return getPrefs().getInt("custom_bubble_color", 0xFF212D3B);
              }

              public static void setBubbleColor(int color) {
                  getPrefs().edit().putInt("custom_bubble_color", color).apply();
              }

              public static int getOutBubbleColor() {
                  return getPrefs().getInt("custom_out_bubble_color", 0xFF2B5278);
              }

              public static void setOutBubbleColor(int color) {
                  getPrefs().edit().putInt("custom_out_bubble_color", color).apply();
              }

              public static int getTextColor() {
                  return getPrefs().getInt("custom_text_color", 0xFFFFFFFF);
              }

              public static void setTextColor(int color) {
                  getPrefs().edit().putInt("custom_text_color", color).apply();
              }

              public static float getBubbleCornerRadiusDp() {
                  return getPrefs().getFloat("bubble_corner_dp", 18.0f);
              }

              public static void setBubbleCornerRadiusDp(float dp) {
                  float clamped = Math.max(4.0f, Math.min(32.0f, dp));
                  getPrefs().edit().putFloat("bubble_corner_dp", clamped).apply();
              }

              public static float getCardCornerRadiusDp() {
