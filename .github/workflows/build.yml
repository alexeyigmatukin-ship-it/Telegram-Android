              click_snippet = f'\n        if (id == {notes_menu_id}) {{\n            try {{ org.telegram.messenger.LocalWhisperHelper.openNotesMainHub(getParentActivity(), dialog_id); }} catch (Throwable ignored) {{}}\n            return;\n        }}'
              if f"if (id == {notes_menu_id})" not in ca and "onMenuItemClick(int id)" in ca:
