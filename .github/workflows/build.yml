name: Build Clean Telegram APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > TMessagesProj/my_telegram.jks

      - name: Inject API Keys & Signing Config
        run: |
          sed -i 's/public static int APP_ID = .*/public static int APP_ID = 2040;/' TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          sed -i 's/public static String APP_HASH = .*/public static String APP_HASH = "b18441a1ff607e10a989891a5462e627";/' TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          
          cat << 'EOF' >> TMessagesProj/build.gradle
          android {
              signingConfigs {
                  release {
                      storeFile file("my_telegram.jks")
                      storePassword "${{ secrets.KEYSTORE_PASSWORD }}"
                      keyAlias "${{ secrets.KEY_ALIAS }}"
                      keyPassword "${{ secrets.KEY_PASSWORD }}"
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Build arm64 Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleAfatRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyTelegram-arm64
          path: TMessagesProj_App/build/outputs/apk/afat/release/*.apk
