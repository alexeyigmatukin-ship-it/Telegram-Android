name: Build Custom Stealth Client APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-stealth-v8-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-stealth-v8-

      - name: Clone whisper.cpp
        run: |
          rm -rf TMessagesProj/jni/whisper
          git clone --depth 1 https://github.com/ggerganov/whisper.cpp.git TMessagesProj/jni/whisper

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > TMessagesProj/my_telegram.jks

      - name: Apply Stealth & Feature Patches
        env:
          API_ID: ${{ secrets.TG_API_ID || '2040' }}
          API_HASH: ${{ secrets.TG_API_HASH || 'b18441a1ff607e10a989891a5462e627' }}
          NEW_PKG: "com.alexey.notesclient"
          NEW_NAME: "Notes"
        run: |
          python3 - << 'EOF'
          import os, re, glob

          api_id = os.environ["API_ID"]
          api_hash = os.environ["API_HASH"]
          new_pkg = os.environ["NEW_PKG"]
          new_name = os.environ["NEW_NAME"]

          # 1. API Keys
          bv_path = "TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java"
          with open(bv_path, "r", encoding="utf-8") as f:
              bv = f.read()
          bv = re.sub(r'public static int APP_ID = .*?;', f'public static int APP_ID = {api_id};', bv)
          bv = re.sub(r'public static String APP_HASH = .*?;', f'public static String APP_HASH = "{api_hash}";', bv)
          with open(bv_path, "w", encoding="utf-8") as f:
              f.write(bv)

          # 2. Safe Package ID & Authorities Replacement (Without breaking AGP 8+ DSL)
          app_gradle = "TMessagesProj_App/build.gradle"
          with open(app_gradle, "r", encoding="utf-8") as f:
              ag = f.read()
          ag = re.sub(r'applicationId\s+["']org\.telegram\.messenger[^"']*["']', f'applicationId "{new_pkg}"', ag)
          ag = re.sub(r'applicationIdSuffix\s+["'][^"']*["']', '', ag)
          with open(app_gradle, "w", encoding="utf-8") as f:
              f.write(ag)

          for manifest in glob.glob("**/AndroidManifest.xml", recursive=True):
              with open(manifest, "r", encoding="utf-8") as f:
                  m = f.read()
              m = m.replace("org.telegram.messenger.provider", f"{new_pkg}.provider")
              m = m.replace("org.telegram.messenger.call_provider", f"{new_pkg}.call_provider")
              m = m.replace("org.telegram.messenger.notification_image_provider", f"{new_pkg}.notification_image_provider")
              m = m.replace("org.telegram.messenger.permission.MAPS_RECEIVE", f"{new_pkg}.permission.MAPS_RECEIVE")
              m = m.replace("org.telegram.messenger.permission.C2D_MESSAGE", f"{new_pkg}.permission.C2D_MESSAGE")
              m = m.replace("org.telegram.messenger.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION", f"{new_pkg}.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION")
              with open(manifest, "w", encoding="utf-8") as f:
                  f.write(m)

          for xml_file in glob.glob("TMessagesProj/src/main/res/values*/strings.xml"):
              with open(xml_file, "r", encoding="utf-8") as f:
                  xml = f.read()
              xml = re.sub(r'<string name="AppName">[^<]*</string>', f'<string name="AppName">{new_name}</string>', xml)
              with open(xml_file, "w", encoding="utf-8") as f:
                  f.write(xml)

          # 3. CustomConfig Helper (Stock Mode & 120Hz)
          h_dir = "TMessagesProj/src/main/java/org/telegram/messenger"
          with open(f"{h_dir}/CustomConfig.java", "w", encoding="utf-8") as f:
              f.write('''package org.telegram.messenger;

          import android.content.Context;
          import android.content.SharedPreferences;

          public class CustomConfig {
              private static SharedPreferences getPrefs() {
                  return ApplicationLoader.applicationContext.getSharedPreferences("my_custom_prefs", Context.MODE_PRIVATE);
              }
              public static boolean isStockMode(long dialogId) {
                  return getPrefs().getBoolean("stock_" + dialogId, false);
              }
              public static void toggleStockMode(long dialogId) {
                  getPrefs().edit().putBoolean("stock_" + dialogId, !isStockMode(dialogId)).apply();
              }
              public static boolean isForce120Hz() {
                  return getPrefs().getBoolean("force_120hz", true);
              }
          }
          ''')

          # 4. Anti-Delete (respects Stock Mode)
          ms_path = f"{h_dir}/MessagesStorage.java"
          with open(ms_path, "r", encoding="utf-8") as f:
              ms = f.read()
          ms, count_del = re.subn(
              r'(public void markMessagesAsDeleted\(\s*final long dialogId[^{]*\{)',
              r'
        if (!CustomConfig.isStockMode(dialogId)) return;',
              ms,
              count=1
          )
          print(f"Anti-delete patch count: {count_del}")
          with open(ms_path, "w", encoding="utf-8") as f:
              f.write(ms)

          # 5. Save Disposable Media (TTL) (respects Stock Mode)
          smv_path = "TMessagesProj/src/main/java/org/telegram/ui/SecretMediaViewer.java"
          with open(smv_path, "r", encoding="utf-8") as f:
              smv = f.read()
          smv = smv.replace(
              "currentMessageObject.isSecretMedia()",
              "(currentMessageObject != null && CustomConfig.isStockMode(currentMessageObject.getDialogId()) && currentMessageObject.isSecretMedia())"
          )
          with open(smv_path, "w", encoding="utf-8") as f:
              f.write(smv)

          # 6. Unlock Transcribe Button (->A) without Premium
          cmc_path = "TMessagesProj/src/main/java/org/telegram/ui/Cells/ChatMessageCell.java"
          with open(cmc_path, "r", encoding="utf-8") as f:
              cmc = f.read()
          cmc = re.sub(
              r'(private boolean hasTranscribeButton\(\)\s*\{)',
              r'
        if (currentMessageObject != null && (currentMessageObject.isVoice() || currentMessageObject.isRoundVideo())) return true;',
              cmc,
              count=1
          )
          with open(cmc_path, "w", encoding="utf-8") as f:
              f.write(cmc)

          # 7. Safe Stock Mode Toggle in ProfileActivity Menu
          pa_path = "TMessagesProj/src/main/java/org/telegram/ui/ProfileActivity.java"
          with open(pa_path, "r", encoding="utf-8") as f:
              pa = f.read()
          if "otherItem.addSubItem(" in pa:
              pa = re.sub(
                  r'(otherItem\.addSubItem\([^;]+;\s*)',
                  r'otherItem.addSubItem(9991, org.telegram.messenger.R.drawable.msg_settings, "Сток-режим (вкл/выкл)");
',
                  pa,
                  count=1
              )
              pa = re.sub(
                  r'(public void onItemClick\(int id\)\s*\{)',
                  r'
                if (id == 9991) { CustomConfig.toggleStockMode(getDialogId()); org.telegram.ui.Components.BulletinFactory.of(ProfileActivity.this).createSimpleBulletin(org.telegram.messenger.R.raw.info, CustomConfig.isStockMode(getDialogId()) ? "Сток-режим ВКЛЮЧЕН" : "Сток-режим ВЫКЛЮЧЕН").show(); return; }',
                  pa,
                  count=1
              )
              print("ProfileActivity stock-mode toggle injected!")
          with open(pa_path, "w", encoding="utf-8") as f:
              f.write(pa)

          # 8. Graphics: Force 120Hz
          au_path = f"{h_dir}/AndroidUtilities.java"
          with open(au_path, "r", encoding="utf-8") as f:
              au = f.read()
          au = au.replace("screenRefreshRate = 60;", "screenRefreshRate = CustomConfig.isForce120Hz() ? 120 : 60;")
          with open(au_path, "w", encoding="utf-8") as f:
              f.write(au)
          EOF

      - name: Integrate Static Whisper.cpp (small-q5_1)
        run: |
          cat << 'EOF' > TMessagesProj/jni/whisper_jni.cpp
          #include <jni.h>
          #include <string>
          #include <vector>
          #include "whisper/include/whisper.h"

          extern "C" {
          #include <libavformat/avformat.h>
          #include <libavcodec/avcodec.h>
          #include <libswresample/swresample.h>
          #include <libavutil/opt.h>
          }

          static struct whisper_context *g_ctx = nullptr;

          static bool decode_audio_to_pcm16(const char* path, std::vector<float>& pcmf32) {
              AVFormatContext* fmt_ctx = nullptr;
              if (avformat_open_input(&fmt_ctx, path, nullptr, nullptr) < 0) return false;
              if (avformat_find_stream_info(fmt_ctx, nullptr) < 0) { avformat_close_input(&fmt_ctx); return false; }
              int stream_idx = av_find_best_stream(fmt_ctx, AVMEDIA_TYPE_AUDIO, -1, -1, nullptr, 0);
              if (stream_idx < 0) { avformat_close_input(&fmt_ctx); return false; }
              AVStream* stream = fmt_ctx->streams[stream_idx];
              const AVCodec* dec = avcodec_find_decoder(stream->codecpar->codec_id);
              AVCodecContext* dec_ctx = avcodec_alloc_context3(dec);
              avcodec_parameters_to_context(dec_ctx, stream->codecpar);
              if (avcodec_open2(dec_ctx, dec, nullptr) < 0) { avcodec_free_context(&dec_ctx); avformat_close_input(&fmt_ctx); return false; }

              SwrContext* swr = nullptr;
              AVChannelLayout out_ch_layout = AV_CHANNEL_LAYOUT_MONO;
              swr_alloc_set_opts2(&swr, &out_ch_layout, AV_SAMPLE_FMT_FLT, 16000, &dec_ctx->ch_layout, dec_ctx->sample_fmt, dec_ctx->sample_rate, 0, nullptr);
              if (!swr || swr_init(swr) < 0) {
                  if (swr) swr_free(&swr);
                  avcodec_free_context(&dec_ctx);
                  avformat_close_input(&fmt_ctx);
                  return false;
              }

              AVPacket* pkt = av_packet_alloc();
              AVFrame* frame = av_frame_alloc();
              while (av_read_frame(fmt_ctx, pkt) >= 0) {
                  if (pkt->stream_index == stream_idx && avcodec_send_packet(dec_ctx, pkt) == 0) {
                      while (avcodec_receive_frame(dec_ctx, frame) == 0) {
                          int out_samples = av_rescale_rnd(swr_get_delay(swr, dec_ctx->sample_rate) + frame->nb_samples, 16000, dec_ctx->sample_rate, AV_ROUND_UP);
                          std::vector<float> buf(out_samples);
                          uint8_t* out_ptr = reinterpret_cast<uint8_t*>(buf.data());
                          int converted = swr_convert(swr, &out_ptr, out_samples, (const uint8_t**)frame->data, frame->nb_samples);
                          if (converted > 0) pcmf32.insert(pcmf32.end(), buf.begin(), buf.begin() + converted);
                      }
                  }
                  av_packet_unref(pkt);
              }
              av_frame_free(&frame); av_packet_free(&pkt); swr_free(&swr); avcodec_free_context(&dec_ctx); avformat_close_input(&fmt_ctx);
              return !pcmf32.empty();
          }

          extern "C" JNIEXPORT jstring JNICALL
          Java_org_telegram_messenger_WhisperHelper_transcribeNative(JNIEnv* env, jclass clazz, jstring modelPath, jstring audioPath) {
              const char* m_path = env->GetStringUTFChars(modelPath, nullptr);
              const char* a_path = env->GetStringUTFChars(audioPath, nullptr);
              if (g_ctx == nullptr) {
                  struct whisper_context_params cparams = whisper_context_default_params();
                  g_ctx = whisper_init_from_file_with_params(m_path, cparams);
              }
              if (g_ctx == nullptr) { env->ReleaseStringUTFChars(modelPath, m_path); env->ReleaseStringUTFChars(audioPath, a_path); return env->NewStringUTF("Ошибка модели"); }
              std::vector<float> pcmf32;
              if (!decode_audio_to_pcm16(a_path, pcmf32)) { env->ReleaseStringUTFChars(modelPath, m_path); env->ReleaseStringUTFChars(audioPath, a_path); return env->NewStringUTF("Ошибка аудио"); }

              whisper_full_params wparams = whisper_full_default_params(WHISPER_SAMPLING_GREEDY);
              wparams.language = "ru";
              wparams.n_threads = 6;
              wparams.print_progress = false;
              wparams.print_realtime = false;

              if (whisper_full(g_ctx, wparams, pcmf32.data(), pcmf32.size()) != 0) { env->ReleaseStringUTFChars(modelPath, m_path); env->ReleaseStringUTFChars(audioPath, a_path); return env->NewStringUTF("Ошибка распознавания"); }
              std::string result;
              for (int i = 0; i < whisper_full_n_segments(g_ctx); ++i) result += whisper_full_get_segment_text(g_ctx, i);
              env->ReleaseStringUTFChars(modelPath, m_path); env->ReleaseStringUTFChars(audioPath, a_path);
              return env->NewStringUTF(result.c_str());
          }
          EOF

          python3 - << 'EOF'
          import re
          cm_path = "TMessagesProj/jni/CMakeLists.txt"
          with open(cm_path, "r", encoding="utf-8") as f:
              cm = f.read()
          m = re.search(r'add_library\(\s*(tmessages\.\d+)', cm)
          tgt = m.group(1) if m else "tmessages.49"
          print(f"Detected CMake target: {tgt}")
          addition = (
              "
set(BUILD_SHARED_LIBS OFF CACHE BOOL "" FORCE)
"
              "set(WHISPER_BUILD_TESTS OFF CACHE BOOL "" FORCE)
"
              "set(WHISPER_BUILD_EXAMPLES OFF CACHE BOOL "" FORCE)
"
              "set(WHISPER_BUILD_SERVER OFF CACHE BOOL "" FORCE)
"
              "set(GGML_OPENMP OFF CACHE BOOL "" FORCE)
"
              "add_subdirectory(whisper)
"
              f"target_sources({tgt} PRIVATE whisper_jni.cpp)
"
              f"target_include_directories({tgt} PRIVATE whisper/include whisper/ggml/include)
"
              f"target_link_libraries({tgt} whisper)
"
          )
          with open(cm_path, "w", encoding="utf-8") as f:
              f.write(cm + addition)
          EOF

          cat << 'EOF' > TMessagesProj/src/main/java/org/telegram/messenger/WhisperHelper.java
          package org.telegram.messenger;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;

          public class WhisperHelper {
              private static final String MODEL_NAME = "ggml-small-q5_1.bin";
              private static final String MODEL_URL = "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small-q5_1.bin";

              public static native String transcribeNative(String modelPath, String audioPath);

              public static String transcribeFile(File audioFile) {
                  try {
                      File dir = new File(ApplicationLoader.applicationContext.getFilesDir(), "whisper");
                      if (!dir.exists()) dir.mkdirs();
                      File model = new File(dir, MODEL_NAME);
                      if (!model.exists() || model.length() < 150000000L) {
                          HttpURLConnection conn = (HttpURLConnection) new URL(MODEL_URL).openConnection();
                          conn.setInstanceFollowRedirects(true);
                          conn.setConnectTimeout(15000);
                          conn.setReadTimeout(60000);
                          try (InputStream in = conn.getInputStream(); FileOutputStream out = new FileOutputStream(model)) {
                              byte[] buf = new byte[8192];
                              int len;
                              while ((len = in.read(buf)) != -1) {
                                  out.write(buf, 0, len);
                              }
                          }
                      }
                      return transcribeNative(model.getAbsolutePath(), audioFile.getAbsolutePath());
                  } catch (Exception e) {
                      return "Ошибка Whisper: " + e.getMessage();
                  }
              }
          }
          EOF

          python3 - << 'EOF'
          import re
          mc_path = "TMessagesProj/src/main/java/org/telegram/messenger/MessagesController.java"
          with open(mc_path, "r", encoding="utf-8") as f:
              mc = f.read()
          hook = '''public void transcribeAudio(MessageObject messageObject) {
                  if (messageObject != null) {
                      Utilities.globalQueue.postRunnable(() -> {
                          java.io.File file = FileLoader.getInstance(currentAccount).getPathToMessage(messageObject.messageOwner);
                          if (file != null && file.exists()) {
                              String text = WhisperHelper.transcribeFile(file);
                              AndroidUtilities.runOnUIThread(() -> {
                                  messageObject.messageOwner.voiceTranscription = text;
                                  messageObject.messageOwner.voiceTranscriptionOpen = true;
                                  NotificationCenter.getInstance(currentAccount).postNotificationName(NotificationCenter.voiceTranscriptionUpdate, messageObject, null, text, true, true);
                              });
                          }
                      });
                      return;
                  }'''
          mc, cnt = re.subn(r'public void transcribeAudio\(MessageObject messageObject\)\s*\{', hook, mc, count=1)
          print(f"Whisper hook injected count: {cnt}")
          with open(mc_path, "w", encoding="utf-8") as f:
              f.write(mc)
          EOF

          cat << 'EOF' >> TMessagesProj/build.gradle
          android {
              signingConfigs {
                  release {
                      storeFile file("my_telegram.jks")
                      storePassword "${{ secrets.KEYSTORE_PASSWORD }}"
                      keyAlias "${{ secrets.KEY_ALIAS }}"
                      keyPassword "${{ secrets.KEY_PASSWORD }}"
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Build arm64 Release APK
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleAfatRelease --max-workers=4

      - name: Check Output APK Package Name
        run: |
          APK_FILE=$(find TMessagesProj_App/build/outputs/apk/afat/release/ -name "*.apk" | head -n 1)
          echo "Built APK: $APK_FILE"
          AAPT2=$(find $ANDROID_HOME/build-tools -name "aapt2" | sort -V | tail -n 1)
          $AAPT2 dump badging "$APK_FILE" | head -n 5

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NotesClient-arm64
          path: TMessagesProj_App/build/outputs/apk/afat/release/*.apk
