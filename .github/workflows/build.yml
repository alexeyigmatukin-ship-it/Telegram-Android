                  def patch_typing(m):
                      sig = m.group(1)
                      long_match = re.search(r'\blong\s+([A-Za-z_][A-Za-z0-9_]*)', sig)
                      param_name = long_match.group(1) if long_match else "dialogId"
                      return f"{sig}\n        if (org.telegram.messenger.CustomConfig.isNoTyping({param_name})) return;"

                  mc = re.sub(r'(public\s+void\s+sendTyping\s*\([^)]*\)\s*\{)', patch_typing, mc, count=1)

                  def patch_read(m):
                      sig = m.group(1)
                      long_match = re.search(r'\blong\s+([A-Za-z_][A-Za-z0-9_]*)', sig)
                      param_name = long_match.group(1) if long_match else "dialogId"
                      return f"{sig}\n        if (org.telegram.messenger.CustomConfig.isGhostRead({param_name})) return;"

                  mc = re.sub(r'(public\s+void\s+markDialogAsRead\s*\([^)]*\)\s*\{)', patch_read, mc, count=1)

                  with open(mc_path, "w", encoding="utf-8") as f:
