name: Build Custom Stealth Client APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Decode Keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > TMessagesProj/my_telegram.jks
            ls -lh TMessagesProj/my_telegram.jks
          else
            echo "Warning: KEYSTORE_BASE64 secret is empty"
          fi

      - name: Apply Stealth, Standalone Package, Signing & Maven Mirror Patches
        env:
          RAW_API_ID: ${{ secrets.TG_API_ID }}
          RAW_API_HASH: ${{ secrets.TG_API_HASH }}
          NEW_PKG: "com.alexey.notesclient"
          NEW_NAME: "Notes"
          KS_STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          python3 - << 'EOF'
          import os, re, glob, json, copy

          api_id = os.environ.get("RAW_API_ID", "").strip() or "2040"
          api_hash = os.environ.get("RAW_API_HASH", "").strip() or "b18441a1ff607e10a989891a5462e627"
          new_pkg = os.environ["NEW_PKG"]
          new_name = os.environ["NEW_NAME"]

          # 0. Fix Maven Central 429 Too Many Requests by adding Google Maven Central Mirror
          mirror_snippet = 'maven { url "https://maven-central.storage-download.googleapis.com/maven2" }\n        mavenCentral()'
          mirror_kts_snippet = 'maven("https://maven-central.storage-download.googleapis.com/maven2")\n        mavenCentral()'

          for g_file in glob.glob("**/*.gradle*", recursive=True):
              if "/build/" in g_file or "\\build\\" in g_file or "/.gradle/" in g_file:
                  continue
              with open(g_file, "r", encoding="utf-8") as f:
                  content = f.read()
              new_content = content
              if g_file.endswith(".kts"):
                  new_content = re.sub(r'\bmavenCentral\(\)', mirror_kts_snippet, new_content)
              else:
                  new_content = re.sub(r'\bmavenCentral\(\)', mirror_snippet, new_content)
              new_content = new_content.replace("https://repo.maven.apache.org/maven2", "https://maven-central.storage-download.googleapis.com/maven2")
              new_content = new_content.replace("https://repo1.maven.org/maven2", "https://maven-central.storage-download.googleapis.com/maven2")
              if new_content != content:
                  with open(g_file, "w", encoding="utf-8") as f:
                      f.write(new_content)
                  print(f"Patched Maven mirror in {g_file}")

          # 1. API Keys
          bv_path = "TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java"
          if os.path.exists(bv_path):
              with open(bv_path, "r", encoding="utf-8") as f:
                  bv = f.read()
              bv = re.sub(r'(public\s+static\s+int\s+APP_ID\s*=\s*)[^;]+;', rf'\g<1>{api_id};', bv)
              bv = re.sub(r'(public\s+static\s+String\s+APP_HASH\s*=\s*)[^;]+;', rf'\g<1>"{api_hash}";', bv)
              with open(bv_path, "w", encoding="utf-8") as f:
                  f.write(bv)

          # 2. Standalone Package ID & Authorities in build.gradle
          for gf_path in glob.glob("**/build.gradle", recursive=True):
              if "/build/" in gf_path or "\\build\\" in gf_path:
                  continue
              with open(gf_path, "r", encoding="utf-8") as f:
                  gf = f.read()
              gf_new = re.sub(
                  r'applicationId\s*=?\s*["\']org\.telegram\.messenger[^"\']*["\']',
                  f'applicationId "{new_pkg}"',
                  gf
              )
              gf_new = re.sub(
                  r'applicationIdSuffix\s*=?\s*["\'][^"\']*["\']',
                  '',
                  gf_new
              )
              gf_new = gf_new.replace("org.telegram.messenger.provider", f"{new_pkg}.provider")
              gf_new = gf_new.replace("org.telegram.messenger.call_provider", f"{new_pkg}.call_provider")
              gf_new = gf_new.replace("org.telegram.messenger.notification_image_provider", f"{new_pkg}.notification_image_provider")
              gf_new = gf_new.replace("org.telegram.messenger.permission.", f"{new_pkg}.permission.")
              if gf_new != gf:
                  with open(gf_path, "w", encoding="utf-8") as f:
                      f.write(gf_new)

          # 3. Configure Release Signing cleanly via env vars if available
          ks_exists = os.path.exists("TMessagesProj/my_telegram.jks") and os.path.getsize("TMessagesProj/my_telegram.jks") > 0
          store_pass = os.environ.get("KS_STORE_PASS", "").strip()
          key_alias = os.environ.get("KS_KEY_ALIAS", "").strip()
          key_pass = os.environ.get("KS_KEY_PASS", "").strip()

          if ks_exists and store_pass and key_alias and key_pass:
              signing_patch = f"""
              gradle.afterProject {{ project ->
                  if (project.android != null) {{
                      try {{
                          def cfg = project.android.signingConfigs.maybeCreate("customRelease")
                          cfg.storeFile = project.rootProject.file("TMessagesProj/my_telegram.jks")
                          cfg.storePassword = System.getenv("KS_STORE_PASS")
                          cfg.keyAlias = System.getenv("KS_KEY_ALIAS")
                          cfg.keyPassword = System.getenv("KS_KEY_PASS")
                          project.android.buildTypes.all {{ bt ->
                              if (bt.name == "release") {{
                                  bt.signingConfig = cfg
                              }}
                          }}
                      }} catch (Exception ignored) {{}}
                  }}
              }}
              """
              for root_g in ["build.gradle", "TMessagesProj_App/build.gradle"]:
                  if os.path.exists(root_g):
                      with open(root_g, "r", encoding="utf-8") as f:
                          rg = f.read()
                      if "customRelease" not in rg:
                          with open(root_g, "w", encoding="utf-8") as f:
                              f.write(rg + "\n" + signing_patch)
                          print(f"Configured customRelease signing in {root_g}")
          else:
              print("Keystore or signing secrets incomplete; skipping customRelease signing override.")

          # 4. google-services.json
          for gs_path in glob.glob("**/google-services.json", recursive=True):
              if "/build/" in gs_path or "\\build\\" in gs_path:
                  continue
              with open(gs_path, "r", encoding="utf-8") as f:
                  gs = json.load(f)
              clients = gs.get("client")
              if isinstance(clients, list):
                  existing_pkgs = {
                      c.get("client_info", {}).get("android_client_info", {}).get("package_name", "")
                      for c in clients
                  }
                  if new_pkg not in existing_pkgs:
                      for c in list(clients):
                          pkg = c.get("client_info", {}).get("android_client_info", {}).get("package_name", "")
                          if pkg == "org.telegram.messenger":
                              cloned = copy.deepcopy(c)
                              cloned["client_info"]["android_client_info"]["package_name"] = new_pkg
                              clients.append(cloned)
                              break
              with open(gs_path, "w", encoding="utf-8") as f:
                  json.dump(gs, f, indent=2)

          # 5. AndroidManifest & XML authorities/permissions
          for mf_path in glob.glob("**/AndroidManifest.xml", recursive=True):
              if "/build/" in mf_path or "\\build\\" in mf_path:
                  continue
              with open(mf_path, "r", encoding="utf-8") as f:
                  mf = f.read()
              for suff in [
                  "provider",
                  "call_provider",
                  "notification_image_provider",
                  "beta_provider",
                  "permission.MAPS_RECEIVE",
                  "permission.C2D_MESSAGE",
                  "DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION",
              ]:
                  mf = mf.replace(f"org.telegram.messenger.{suff}", f"{new_pkg}.{suff}")
              mf = re.sub(
                  r'(android:authorities=["\'])org\.telegram\.messenger\.([^"\']+)(["\'])',
                  rf'\g<1>{new_pkg}.\g<2>\g<3>',
                  mf
              )
              with open(mf_path, "w", encoding="utf-8") as f:
                  f.write(mf)

          for rx_path in glob.glob("**/res/xml/*.xml", recursive=True):
              if "/build/" in rx_path or "\\build\\" in rx_path:
                  continue
              with open(rx_path, "r", encoding="utf-8") as f:
                  rx = f.read()
              if "org.telegram.messenger" in rx:
                  rx = rx.replace("org.telegram.messenger", new_pkg)
                  with open(rx_path, "w", encoding="utf-8") as f:
                      f.write(rx)

          # 6. AppName
          for xml_path in glob.glob("TMessagesProj/src/main/res/values*/strings.xml"):
              with open(xml_path, "r", encoding="utf-8") as f:
                  xml = f.read()
              xml = re.sub(r'<string name="AppName">[^<]*</string>', f'<string name="AppName">{new_name}</string>', xml)
              with open(xml_path, "w", encoding="utf-8") as f:
                  f.write(xml)

          # 7. CustomConfig
          h_dir = "TMessagesProj/src/main/java/org/telegram/messenger"
          custom_cfg_code = """package org.telegram.messenger;

          import android.content.Context;
          import android.content.SharedPreferences;
          import java.util.Collections;
          import java.util.HashSet;
          import java.util.Set;

          public class CustomConfig {
              private static final Set<String> deletedIds = Collections.synchronizedSet(new HashSet<>());

              private static SharedPreferences getPrefs() {
                  return ApplicationLoader.applicationContext.getSharedPreferences("my_custom_prefs", Context.MODE_PRIVATE);
              }

              public static boolean isStockMode(long dialogId) {
                  return getPrefs().getBoolean("stock_" + dialogId, false);
              }

              public static void toggleStockMode(long dialogId) {
                  getPrefs().edit().putBoolean("stock_" + dialogId, !isStockMode(dialogId)).apply();
              }

              public static boolean isForce120Hz() {
                  return getPrefs().getBoolean("force_120hz", true);
              }

              public static void markDeletedLocally(long dialogId, int msgId) {
                  deletedIds.add(dialogId + "_" + msgId);
              }

              public static boolean isDeletedLocally(long dialogId, int msgId) {
                  return deletedIds.contains(dialogId + "_" + msgId);
              }
          }
          """
          with open(f"{h_dir}/CustomConfig.java", "w", encoding="utf-8") as f:
              f.write(custom_cfg_code)

          # 8. Force 120Hz
          au_path = f"{h_dir}/AndroidUtilities.java"
          if os.path.exists(au_path):
              with open(au_path, "r", encoding="utf-8") as f:
                  au = f.read()
              au = au.replace("screenRefreshRate = 60;", "screenRefreshRate = CustomConfig.isForce120Hz() ? 120 : 60;")
              with open(au_path, "w", encoding="utf-8") as f:
                  f.write(au)

          print("All stealth, standalone, signing & mirror patches applied successfully!")
          EOF

      - name: Build arm64 Release APK
        env:
          KS_STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleAfatRelease --max-workers=2

      - name: Verify APK Package Name
        run: |
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | head -n 1)
          APK_FILE=$(find TMessagesProj_App/build/outputs/apk -name "*.apk" | head -n 1)
          echo "APK Path: $APK_FILE"
          test -n "$APK_FILE"
          "$AAPT2" dump badging "$APK_FILE" | grep -E "package:|application-label:"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NotesClient-arm64
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
