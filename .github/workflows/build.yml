              public static void markDeletedBatch(long dialogId, java.util.List<Integer> msgIds) {
                  if (!isSaveDeletedEnabled(dialogId) || msgIds == null || msgIds.isEmpty()) return;
                  Set<String> set = getDeletedSet();
                  for (Integer id : msgIds) {
                      if (id != null) {
                          set.add(dialogId + "_" + id);
                          set.add("0_" + id);
                      }
                  }
                  getPrefs().edit().putStringSet("deleted_msgs_set", new HashSet<>(set)).apply();
              }

